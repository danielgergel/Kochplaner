<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kochplaner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<script src="js/theme-boot.js"></script>
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<title>Kochplaner</title>
</head>
<body>
<div class="wrap">
<header><div class="hin">
  <div class="ttl"><h1>Kochplaner</h1><div class="ic">
    <button id="bfr" aria-label="Kühlschrank"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 9.2h16"/><path d="M15.4 5.2v2.3M15.4 13.1v3.4"/></svg><span>Kühlschrank</span></button>
    <button id="bdi" aria-label="Würfeln"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle class="pip" cx="8.2" cy="8.2" r="1.45"/><circle class="pip" cx="15.8" cy="8.2" r="1.45"/><circle class="pip" cx="12" cy="12" r="1.45"/><circle class="pip" cx="8.2" cy="15.8" r="1.45"/><circle class="pip" cx="15.8" cy="15.8" r="1.45"/></svg><span>Würfeln</span></button>
    <button id="bdy" aria-label="Tagebuch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.2h11.2A1.3 1.3 0 0 1 20.5 4.5v15a1.3 1.3 0 0 1-1.3 1.3H8"/><path d="M8 3.2v17.6"/><path d="M4.6 7.2H8M4.6 12H8M4.6 16.8H8"/><path d="M11.2 8h6M11.2 12h6M11.2 16h4"/></svg><span>Tagebuch</span></button>
    <button id="bhh" aria-label="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.2v3M12 18.8V22M2.2 12h3M18.8 12H22M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span>Einstellungen</span></button>
  </div></div>
  <div class="seg" role="tablist" id="seg">
    <button role="tab" data-tab="R" aria-selected="true">Rezepte</button>
    <button role="tab" data-tab="P" aria-selected="false">Plan <b id="bp"></b></button>
    <button role="tab" data-tab="E" aria-selected="false">Einkauf <b id="be"></b></button>
  </div>
</div></header>
<main id="app"></main>
</div>
<div id="det" hidden></div>
<div id="pnl" hidden></div>
<div id="scn" hidden></div>
<div id="subpop" hidden></div>
<div id="toast" role="status"></div>
<button id="fab" aria-label="Produkt scannen und prüfen, ob es noch ins Tagesziel passt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg><span>Scannen</span></button>
<script type="module" src="js/app.js"></script>
</body>
</html>
