<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kochplaner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light}[hidden]{display:none!important}body{margin:0}</style>
<title>Kochplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: eine Spalte fürs iPhone. Oben Reiter Rezepte / Plan / Einkauf, ein Rezept öffnet als Vollbild-Ansicht zum Kochen. */
:root{
  --bg:#f1f5f4; --surface:#ffffff; --surface2:#e4edeb; --fg:#12201e; --muted:#566a66; --line:#cfdcd9;
  --accent:#0f766e; --accent-fg:#ffffff; --done:#d7efe9; --warn:#b45309;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1716; --surface:#16211f; --surface2:#1f2e2c; --fg:#e6f0ee; --muted:#8fa6a1; --line:#293a37;
    --accent:#2dd4bf; --accent-fg:#04201c; --done:#173a35; --warn:#f0a43a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#16211f; --surface2:#1f2e2c; --fg:#e6f0ee; --muted:#8fa6a1; --line:#293a37;
  --accent:#2dd4bf; --accent-fg:#04201c; --done:#173a35; --warn:#f0a43a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.35;padding-inline:16px;padding-block:0 60px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin-inline:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-inline:-16px;padding-inline:16px}
.hin{max-width:560px;margin-inline:auto}
h1{font-family:var(--f-disp);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0 0 8px;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;min-height:42px;border-radius:9px;font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.02em;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg b{font-weight:700;color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.tools input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 17px var(--f-body);padding:0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rc{display:grid;grid-template-columns:1fr 52px;gap:8px;margin-bottom:8px}
.rb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-width:0}
.rb .top{display:flex;gap:8px;align-items:baseline}
.id{font-family:var(--f-disp);font-weight:700;font-size:16px;color:var(--accent);flex:none}
.rb b{font-weight:600;font-size:16.5px;line-height:1.25}
.meta{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.add{border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-disp);font-weight:700;font-size:26px;line-height:1;display:grid;place-items:center}
.add[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:20px}
.empty{color:var(--muted);font-size:15px;padding:18px 4px}
.sec{font-family:var(--f-disp);font-size:18px;margin:16px 0 6px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.prow .nm{min-width:0}
.prow .nm b{display:block;font-weight:600}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:20px;line-height:1}
.step span{min-width:30px;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:20px}
.prow .acts{grid-column:1/-1;display:flex;gap:8px}
.btn{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:0 16px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-family:var(--f-disp);font-size:20px;letter-spacing:.03em;font-weight:700}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.prow .btn{flex:1}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font-size:15px;color:var(--muted)}
.sum b{color:var(--fg)}
.cnt{font-size:14px;color:var(--muted);margin:2px 2px 8px;font-variant-numeric:tabular-nums}
.ck{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);padding:11px 12px;min-height:52px}
.ck:first-child{border-top:0}
.ck i{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.ck svg{width:18px;height:18px;stroke:var(--accent-fg);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}
.ck[aria-checked="true"] svg{opacity:1}
.ck[aria-checked="true"] .l,.ck[aria-checked="true"] .q{text-decoration:line-through;color:var(--muted)}
.ck .l{font-size:16.5px;min-width:0}
.ck .l small{display:block;color:var(--muted);font-size:13px}
.ck .q{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;font-size:15.5px;max-width:48vw}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vor{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vor button{min-height:38px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface2);font-size:14.5px}
.vor button[aria-pressed="true"]{text-decoration:line-through;color:var(--muted);background:var(--done)}
.note{font-size:13px;color:var(--muted);margin:10px 2px}
#det{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:0 16px 80px;-webkit-overflow-scrolling:touch}
#det[hidden]{display:none}
.dtop{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;margin-inline:-16px;padding-inline:16px;z-index:2}
.dtop .in{max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:10px}
.dtop .back{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.dtop .wk{font-size:13px;color:var(--muted);flex:1;text-align:right}
.dtop .wk.on{color:var(--accent);font-weight:600}
.dbody{max-width:560px;margin-inline:auto}
.dbody h2{font-size:24px;line-height:1.2;margin:6px 0 8px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:13.5px;font-weight:600;background:var(--surface2);border-radius:20px;padding:3px 11px;font-variant-numeric:tabular-nums}
.stp{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);padding:14px 12px}
.stp:first-child{border-top:0}
.stp .n{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:18px}
.stp .t{font-size:18px;line-height:1.4}
.stp[aria-checked="true"] .n{background:var(--accent);color:var(--accent-fg)}
.stp[aria-checked="true"] .t{color:var(--muted);text-decoration:line-through}
.dn{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:14.5px}
.drow{display:flex;gap:8px;margin-top:14px}
.drow .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ttl h1{margin:0}
.ic{display:flex;gap:8px}
.ic button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ic svg{width:22px;height:22px;stroke:var(--accent);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
#pnl{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:0 16px 80px;-webkit-overflow-scrolling:touch}
#pnl[hidden]{display:none}
.finp{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 17px var(--f-body);padding:0 14px;margin-bottom:6px}
.ing{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.ing button{min-height:40px;padding:0 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.ing button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.fmiss{display:block;font-size:13.5px;margin-top:3px;color:var(--warn)}
.fok{display:block;font-size:13.5px;margin-top:3px;color:var(--accent);font-weight:600}
.dice-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;margin:14px 0}
.dice-card b{font-size:22px;line-height:1.25;font-weight:600}
.dice-card .id{font-size:18px}
.dice-acts{display:flex;gap:8px;margin-top:10px}
.dice-acts .btn{flex:1}
.bigroll{width:100%;min-height:58px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.04em;margin-top:6px}
.ic{gap:6px}
.ic button{width:40px;height:40px;position:relative}
.ic svg{width:21px;height:21px}
.ic button.sync::after,.ic button.err::after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.ic button.err::after{background:var(--warn)}
.dnav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin:6px 0 10px}
.dnav button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px}
.dnav b{text-align:center;font-family:var(--f-disp);font-size:22px;letter-spacing:.02em}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.tot .row1{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.tot .row1 b{font-family:var(--f-disp);font-size:28px;line-height:1}
.tot .row1 span{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.over i{background:var(--warn)}
.ent{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.ent:first-child{border-top:0}
.ent b{font-weight:600;font-size:16px;min-width:0}
.ent .meta{grid-column:1}
.ent .eac{grid-column:2;grid-row:1/3;display:flex;gap:4px;align-items:center}
.ent .eac button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:18px;line-height:1}
.ent .eac span{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.frm .full{grid-column:1/-1}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.frm input,.frm select,.frm textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 17px var(--f-body);padding:10px 12px;min-height:46px}
.frm textarea{min-height:120px;resize:vertical;line-height:1.35}
.chk2{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--fg)!important;font-weight:500!important;flex-direction:row!important}
.chk2 input{width:22px;height:22px;min-height:0;padding:0}
.wk7{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-size:15px}
.wk7:first-child{border-top:0}
.wk7 span:last-child{color:var(--muted);font-size:13.5px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:.06em;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.stack .btn{width:100%}
.goalr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}

body{padding-top:env(safe-area-inset-top,0px)}</style>

<div class="wrap">
<header><div class="hin">
  <h1>Kochplaner</h1>
  <div class="seg" role="tablist" id="seg">
    <button role="tab" data-tab="R" aria-selected="true">Rezepte</button>
    <button role="tab" data-tab="P" aria-selected="false">Plan <b id="bp"></b></button>
    <button role="tab" data-tab="E" aria-selected="false">Einkauf <b id="be"></b></button>
  </div>
</div></header>
<main id="app"></main>
</div>
<div id="det" hidden></div>
<div id="toast" role="status"></div>

<script>

const F=[
{id:"F1",n:"Banane-Hafer-Shake",k:460,p:39,t:"3 Min",z:["300 ml Milch 1,5 %","1 Scoop Whey (30 g, Vanille)","1 Banane","30 g Haferflocken","Eiswürfel, Zimt"],s:["Alles in den Mixer, 30 Sek. mixen.","Eiswürfel rein = cremig und weniger „süß-pappig“."]},
{id:"F2",n:"Schoko-Erdnuss-Shake",k:460,p:42,t:"3 Min",z:["300 ml Milch 1,5 %","1 Scoop Whey Schoko","15 g Erdnussmus","30 g Haferflocken","Eiswürfel"],s:["Alles mixen, fertig. Schmeckt wie Snickers-Shake."]},
{id:"F3",n:"Skyr-Bowl",k:430,p:35,t:"2 Min",z:["250 g Skyr natur","100 g Beeren (TK ok)","30 g Haferflocken oder Granola","15 g Mandeln","1 TL Honig"],s:["Skyr in eine Schüssel.","Beeren, Haferflocken, Mandeln und Honig drauf."]},
{id:"F4",n:"Rührei-Toast mit Hüttenkäse",k:400,p:33,t:"8 Min",z:["3 Eier","1 Scheibe Toast","100 g körniger Frischkäse","1 Tomate","Salz, Pfeffer, Schnittlauch"],s:["Eier in beschichteter Pfanne bei mittlerer Hitze stocken lassen, würzen.","Toast rösten, mit Frischkäse bestreichen.","Rührei und Tomatenscheiben drauf."]},
{id:"F5",n:"3-Zutaten-Protein-Pancakes",k:480,p:38,t:"10 Min",mp:"Einfrierbar (2 Monate)",z:["1 Banane","2 Eier","40 g Haferflocken","25 g Whey Vanille","1 TL Backpulver"],s:["Alles mit Stabmixer pürieren.","Kleine Pancakes in beschichteter Pfanne bei mittlerer Hitze 2 Min je Seite backen.","Optional mit Zimt oder 50 g Beeren."]},
{id:"F6",n:"Overnight Oats",k:390,p:32,t:"3 Min (am Vorabend)",mp:"3 Tage im Kühlschrank",z:["40 g Haferflocken","200 g Skyr","100 ml Milch","1 TL Chiasamen","80 g Himbeeren"],s:["Alles außer den Himbeeren im Glas verrühren, abends in den Kühlschrank.","Morgens mit den Himbeeren (TK ist okay, sie tauen bis dahin an) toppen und löffeln."]},
{id:"F7",n:"Brezel-Upgrade",k:370,p:29,t:"3 Min",z:["1 Brezel (ca. 80 g)","40 g Frischkäse light","4 Scheiben Putenbrust","Gurkenscheiben"],s:["Brezel aufschneiden, mit Frischkäse bestreichen.","Pute und Gurke rein. Deine gewohnte Brezel, nur mit Eiweiß."]},
{id:"F8",n:"Spiegeleier mit Brot, Hüttenkäse und Tomate",k:450,p:31,u:"mit 2 Eiern",t:"8 Min",note:"Dein Wochenend-Klassiker: Mit 3 Eiern sind es ca. 520 kcal und 38 g Eiweiß.",z:["2 Eier","1 TL Öl","2 Scheiben Brot","100 g körniger Frischkäse","1 Tomate","Salz, Pfeffer, Schnittlauch"],s:["Eier in beschichteter Pfanne mit etwas Öl zu Spiegeleiern braten, mit Salz und Pfeffer würzen.","Brot toasten, mit Hüttenkäse bestreichen.","Eier, Tomatenscheiben und Schnittlauch drauf. Wer will, nimmt Gurkenscheiben dazu."]},
{id:"F9",n:"Airfryer-Frühstückskartoffeln mit Spiegelei und Kräuterquark",k:480,p:29,u:"mit 2 Eiern",t:"25 Min",note:"Mit 3 Eiern ca. 550 kcal und 36 g Eiweiß. Reste der Kartoffeln vom Vortag gehen auch.",z:["250 g Kartoffeln","2 Eier","100 g Magerquark + Schnittlauch, Salz","2 TL Öl","Paprikapulver, Salz, Pfeffer"],s:["Kartoffeln in Würfel schneiden, mit 1 TL Öl, Paprikapulver und Salz mischen, Airfryer 200 °C, 18–20 Min, einmal wenden.","Eier mit 1 TL Öl in der Pfanne zu Spiegeleiern braten.","Quark mit Schnittlauch, Salz und Pfeffer verrühren.","Kartoffeln mit Spiegeleiern und Kräuterquark anrichten."]}];
const S=[
{id:"S1",n:"Skyr mit Beeren & Mandeln",k:265,p:29,t:"2 Min",z:["250 g Skyr","100 g Beeren","10 g Mandeln"],s:["Alles in eine Schüssel."]},
{id:"S2",n:"Skyr-Schoko-Creme",k:290,p:30,t:"3 Min",z:["250 g Skyr","1 EL Backkakao","1 TL Honig oder Süßstoff","1 Banane"],s:["Skyr mit Kakao und Honig glatt rühren.","Banane in Scheiben drüber."]},
{id:"S3",n:"Puten-Frischkäse-Röllchen",k:240,p:30,t:"5 Min",z:["100 g Putenaufschnitt","60 g Frischkäse light","Gurke in Stiften","2 Reiswaffeln"],s:["Pute mit Frischkäse bestreichen, Gurke einrollen.","Reiswaffeln dazu."]},
{id:"S4",n:"Hüttenkäse-Tomaten-Brot",k:340,p:27,t:"4 Min",z:["200 g körniger Frischkäse","100 g Tomaten","1 Scheibe Brot","1 TL Olivenöl","Salz, Pfeffer, Basilikum"],s:["Brot rösten, Hüttenkäse und Tomaten drauf.","Öl, Pfeffer, Basilikum drüber."]},
{id:"S5",n:"Quark-Mousse",k:230,p:31,t:"3 Min",z:["250 g Magerquark","1 TL Backkakao","1 EL Süßstoff oder Honig","100 g Himbeeren"],s:["Quark mit Kakao und Süße cremig rühren.","Himbeeren oben drauf."]},

{id:"I16",q:"kimberlygazelka",c:"Hauptmahlzeit (16 Uhr)",n:"High-Protein Speck-Käsefladen",note:"Enthält Schweine-Speck, nur für dich. Wenn deine Freundin mitisst: Putenbacon nehmen.",k:406,p:48,u:"pro Portion (4 g Carbs, 22 g Fett)",pt:"2 Portionen",w:0.5,t:"20 Min",z:["250 g Light-Reibekäse","100 g Light-Speckwürfel","1 EL Kräutercreme light","Salatblätter, Gurken- und Tomatenscheiben"],s:["Speckwürfel auf einem Blech mit Backpapier verteilen, Käse darübergeben.","Bei 200 °C Ober-/Unterhitze ca. 10 Min. backen, bis der Käse goldbraun ist.","Kurz abkühlen lassen, Backpapier abziehen.","Mit Kräutercreme bestreichen, mit Salat, Gurke und Tomate belegen, einklappen."]},

{id:"I18",q:"berkayl10",c:"Hauptmahlzeit (16 Uhr)",n:"1,1-kg-Diät-Bowl",k:720,p:76,u:"gesamt (95 g Carbs, 4 g Fett)",t:"25 Min",note:"4 g Fett wirken für 200 g Hähnchen plus 200 g Skyr sehr niedrig. Für genaues Tracking nachrechnen. Anleitung im Post fehlt, Vorgehen ist vermutet.",z:["350 g Kartoffeln","200 g Gurken","250 g Tomaten","200 g Hähnchenbrust (roh gewogen)","200 g Skyr","Salz, Knoblauch, Schnittlauch, Sriracha, Maggi"],s:["Kartoffeln und Hähnchen garen (Airfryer 190 °C, ca. 18 bzw. 12 Min).","Gurken und Tomaten schneiden.","Skyr mit Knoblauch, Schnittlauch, Salz und Maggi zur Soße verrühren, alles anrichten."]},
{id:"I19",q:"ehmzet_zero (Video von @abbasmomo)",c:"Hauptmahlzeit (16 Uhr)",n:"Flammkuchen-Brezeln",k:686,p:50,u:"pro Portion (2 Brezeln, je 343 kcal, 25 g Eiweiß, 37 g Carbs, 11 g Fett)",pt:"4 Brezeln",w:0.5,t:"20 Min",z:["4 TK-Brezeln","Etwas Milch zum Eintauchen","200 g saure Sahne","125 g Putenschinken-Würfel","100 g Light-Streukäse","30 g Lauchzwiebeln"],s:["Brezeln kurz in Milch eintauchen.","Mit saurer Sahne, Schinken, Käse und Lauchzwiebeln belegen.","Bei 200 °C ca. 15 Min. backen."]},
{id:"I20",q:"Dein Lieblingsrezept",c:"Hauptmahlzeit (16 Uhr)",n:"Hack-Tacos aus dem Airfryer mit Skyr-Dip",k:700,p:60,u:"pro Portion (2 Tacos)",pt:"ca. 3 Portionen (500 g Hack)",w:0.34,t:"25 Min",note:"Mengen für 2 Personen (ca. 340 g Hack, 2 Wraps pro Person) angenommen. Nährwerte von mir geschätzt, sie hängen von den Wraps ab. Mit 1 Wrap pro Portion ca. 560 kcal. Backzeit: Airfryer 200–210 °C ca. 5–6 Min. (nach 3 Min. wenden), im Ofen Umluft 210 °C ca. 8–10 Min.",z:["500 g Rinderhack (mager)","1 Zwiebel","2 EL Knoblauchpulver","2 EL Paprikapulver","1 EL Cayennepfeffer","1 EL Salz (nach Geschmack, eher weniger)","Oregano","80 g Taco-Soße","80 g Tomatensoße","6 Wraps","150 g Reibekäse (light)","Dip: 150 g Skyr","Dip: 60 g Taco-Soße","Dip: 1 EL Honig","Dip: Cayennepfeffer"],s:["Zwiebel anbraten, Hack dazugeben und bei hoher Hitze kräftig anbraten.","Knoblauchpulver, Paprikapulver, Cayennepfeffer, Salz und Oregano zugeben, dann Taco-Soße und Tomatensoße einrühren.","Wraps mit der Hackmasse füllen (ca. 80 g Hack pro Wrap), Reibekäse drauf, zuklappen.","Im Airfryer bei 200–210 °C ca. 5–6 Min. backen (je nach Korbgröße in 2–3 Chargen), nach 3 Min. wenden, bis sie knusprig sind.","Dip: Skyr mit Taco-Soße, Honig und etwas Cayennepfeffer verrühren."]},
{id:"I21",q:"Instagram (Account im Screenshot nicht sichtbar)",c:"Hauptmahlzeit (16 Uhr)",mp:"Meal-Prep: 3–4 Tage Kühlschrank, einfrierbar",n:"Gebratener Reis mit Hähnchen (Fitness Edition)",k:445,p:31,u:"pro Portion (56 g Carbs, 9,5 g Fett)",pt:"4 Portionen",t:"35 Min",note:"Das Sesamöl ist wichtig für den Geschmack und sollte nicht weggelassen werden.",z:["400 g Hähnchenbrust","15 g Speisestärke","200 g Basmatireis (roh)","1 rote Paprika","½ Chinakohl","80 g TK-Erbsen","4 Möhren","30 ml Sesamöl","65 ml Sojasauce (dunkel)","Salz, Pfeffer, je 1–2 EL Currypulver und Paprikapulver","ca. 400 ml Gemüsebrühe zum Reiskochen","2 EL Öl zum Anbraten"],s:["Hähnchen klein schneiden. Etwa ein Viertel der Sojasauce und die Speisestärke mit 1 EL Wasser in einer Schüssel gut verrühren, Hähnchen dazugeben und durchmischen. Beiseite stellen.","Gemüse klein schneiden. Reis in Gemüsebrühe kochen.","Etwas Fett in einer Pfanne erhitzen, Hähnchen ca. 4 Min. rundherum anbraten und herausnehmen.","Paprika, Möhren und Chinakohl 10 Min. bei geschlossenem Deckel garen, ab und zu umrühren (große Pfanne oder Wok nehmen). Aufgetaute Erbsen, Hähnchen und Reis dazugeben.","Restliche Sojasauce, Sesamöl und Gewürze zugeben, gut durchmischen."]},
{id:"I22",q:"Instagram (Account im Screenshot nicht sichtbar)",c:"Hauptmahlzeit / Beilage",mp:"Meal-Prep: 3 Tage Kühlschrank, schmeckt durchgezogen besser",n:"Roter Linsen-Couscous-Salat",k:700,p:27,u:"pro Portion (4 Portionen angenommen)",pt:"ca. 4 Portionen",t:"20 Min",note:"Im Post stehen weder Portionen noch Nährwerte, beides von mir geschätzt. Das Dressing ist kalorienreich (7 EL Öl). Mit 150 g Hähnchen dazu wird es eine Hauptmahlzeit mit mehr Eiweiß.",z:["250 g roter Linsen-Couscous","250 ml heißes Wasser","1 TL Gemüsebrühe","220 g Kichererbsen (1 Dose, Abtropfgewicht)","2 EL Ghee","2 Knoblauchzehen","2 rote Zwiebeln","200 g Cherrytomaten","½–1 Salatgurke","1 rote Paprika","Kerne von ½–1 Granatapfel","Etwas Minze, reichlich Petersilie","150 g Feta","Dressing: 7 EL Olivenöl","Dressing: 1 Zitrone, ausgepresst","Dressing: 1–2 EL Dattelmus","Salz, Pfeffer"],s:["Brühe in das heiße Wasser rühren, Couscous damit übergießen und 5 Min. quellen lassen.","Zwiebeln, Tomaten, Gurke, Paprika, Feta und Kräuter klein schneiden, Granatapfelkerne dazu.","Kichererbsen mit Knoblauch im Ghee scharf anbraten.","Alles mit dem Couscous mischen.","Dressing aus Olivenöl, Zitronensaft, Dattelmus, Salz und Pfeffer verrühren und unterheben."]},
{id:"I23",q:"alinesfits",c:"Hauptmahlzeit (16 Uhr)",mp:"3 Tage Kühlschrank, Mais erst vor dem Essen drüber",n:"High-Protein Feta-Skyr-Salat mit crunchy Mais",k:500,p:52,u:"gesamt (52 g Eiweiß laut Video)",t:"15 Min",note:"Kalorien von mir geschätzt, Eiweiß laut Video.",z:["180 g Light Feta (9 % Fett)","150 g Skyr natur","200 g Gurke","120 g Cherrytomaten","1 kleine rote Zwiebel","15 g Mais","Petersilie","Für den crunchy Mais: Ölspray, Knoblauchpulver, geräuchertes Paprikapulver, Salz","Für das Dressing: Skyr, Zitronensaft, Salz, Pfeffer, Knoblauchpulver"],s:["Mais mit etwas Ölspray, Knoblauchpulver, geräuchertem Paprikapulver und Salz vermengen und im Airfryer goldbraun und knusprig backen.","Gurke, Tomaten, rote Zwiebel, Feta und Petersilie klein schneiden.","Für das Dressing den Skyr mit Zitronensaft, Salz, Pfeffer und Knoblauchpulver verrühren.","Alles vermengen und den crunchy Mais darübergeben."]},
{id:"I24",q:"Instagram (Account im Screenshot nicht sichtbar)",c:"Hauptmahlzeit (16 Uhr)",n:"Spaghetti mit Gurken-Joghurt-Soße und Gyros-Hähnchen",k:693,p:36,u:"pro Portion (94 g Carbs, 16 g Fett)",t:"20 Min",z:["120 g Spaghetti oder Nudeln","200 g Joghurt","½ Gurke","1 Knoblauchzehe (optional)","Viele Kräuter, frisch oder getrocknet","Spritzer Zitronensaft","100 g Hähnchenbrustaufschnitt","Gyrosgewürz","Salz, Pfeffer","Optional: crispy Chili-Öl"],s:["Nudeln nach Packungsbeilage kochen. Hähnchen in kleine Scheiben schneiden und mit Gyrosgewürz anbraten.","Gurke raspeln und auf einem Küchentuch entwässern.","Joghurt mit Salz, Pfeffer, Knoblauch, Kräutern, Zitronensaft und der Gurke mischen.","Alles zu den Spaghetti geben, den Aufschnitt dazu und mit etwas Chili-Öl toppen."]},
{id:"I25",q:"giulia.go… (Name abgeschnitten)",c:"Hauptmahlzeit (16 Uhr)",mp:"Meal-Prep: 3 Tage Kühlschrank",n:"Maultaschen-Gemüse-Pfanne in Sahnesoße",k:450,p:32,u:"pro Portion (42 g Carbs, 14 g Fett)",pt:"3 Portionen",t:"25 Min",note:"Nimm Gemüse-Maultaschen ohne Schwein (Packung prüfen). Im Original Like Gyros oder Like Chicken (vegan), hier Hähnchen. Die Protein-Sahne ist optional, ohne sie ändern sich die Nährwerte.",z:["360 g Gemüse-Maultaschen (1 Packung)","400 g TK-Kaisergemüse","Kalorienölspray (ca. 2 Sprühstöße)","250 ml Kochsahne 7 %","200 ml Wasser","180 g Hähnchenbrust (alternativ 1 Packung Like Chicken)","Gewürze (z. B. Knoblauch, Kartoffelgewürz)","Optional Protein-Sahne: 100 ml Milch 1,5 %","Optional Protein-Sahne: 35 g More Protein Sahne"],s:["Maultaschen klein schneiden und in einer gut beschichteten Pfanne mit dem Ölspray anbraten.","TK-Gemüse und Wasser dazugeben und köcheln lassen, bis das Gemüse weich ist.","Würzen, gebratenes Hähnchen und Kochsahne dazugeben und köcheln lassen.","Optional: Milch mit der Protein-Sahne im Shaker mischen und kurz stehen lassen.","Hitze runterstellen und die Protein-Sahne unterrühren."]},
{id:"I26",q:"Instagram (Account im Screenshot nicht sichtbar)",c:"Hauptmahlzeit (16 Uhr)",mp:"Meal-Prep: 3–4 Tage Kühlschrank, einfrierbar",n:"Reis-Bohnen-Auflauf (alles in einer Form)",k:404,p:18,u:"pro Portion (62 g Carbs, 5 g Fett)",pt:"2 Portionen",t:"45 Min",note:"Der Post nennt 25 g Eiweiß, nachgerechnet sind es eher ca. 18 g. Sehr leicht und günstig. Mit 150 g Hähnchen oder 100 g Skyr als Dip wird er eiweißreicher.",z:["100 g Reis (Basmati oder Jasmin, ungekocht)","140 g Mais (1 kleine Dose)","140 g Kidneybohnen (1 Dose)","150 ml Brühe","200 ml passierte Tomaten","50 g leichter Reibekäse","Salz, Pfeffer, Paprikapulver (mexikanisches Gewürz optional)"],s:["Backofen auf 200 °C Ober-/Unterhitze vorheizen.","Reis, Mais und Kidneybohnen (beides vorher abtropfen) in eine Auflaufform geben.","Passierte Tomaten, Brühe und Gewürze dazugeben, kurz verrühren und die Form mit Alufolie abdecken.","35–45 Min. backen, bis der Reis gar ist. Die letzten 10 Min. die Folie abnehmen und den Käse obenauf verteilen.","Mit Salz und Pfeffer abschmecken."]},
{id:"I27",q:"@gourmet_leicht",c:"Hauptmahlzeit (16 Uhr)",mp:"Meal-Prep: 3–4 Tage Kühlschrank, einfrierbar",n:"Hack-Nudel-Auflauf mit Brokkoli",k:530,p:42,u:"pro XL-Portion (von mir geschätzt)",pt:"4 XL-Portionen",t:"45 Min",note:"Nährwerte stehen nicht im Post, von mir mit Light-Hack geschätzt. Nimm Rinderhack. Einfach zu verdoppeln.",z:["300 g Nudeln","400 g Rinderhack (light)","1 Brokkoli (ca. 500 g)","250 ml Sahne 7 %","40 g Tomatenmark","80 g Käse, gerieben","200 ml Wasser","Salz, Pfeffer","1 EL Zuckerersatz oder Zucker","Ölspray"],s:["Backofen auf 200 °C vorheizen. Brokkoli in Röschen 2 Min. in heißem Wasser vorkochen und herausnehmen. Nudeln 3 Min. kürzer als auf der Packung kochen (bissfest), dabei etwas Nudelwasser aufheben.","Hack in etwas Ölspray anbraten und mit Salz und Pfeffer würzen.","Tomatenmark, Sahne, Wasser, Zuckerersatz, reichlich Pfeffer und Salz sowie einen Schuss Nudelwasser dazugeben.","Nudeln in eine Auflaufform geben, Brokkoli und Soße dazu, mischen und den Käse darüberstreuen.","Bei 200 °C Ober-/Unterhitze 25–30 Min. backen."]},
{id:"I28",q:"fit_mit_s… (Name abgeschnitten)",c:"Hauptmahlzeit (16 Uhr)",n:"Mozzarella-Salat mit knusprigen Maultaschen",k:559,p:33,u:"pro Portion (21 g Fett, 59 g Carbs)",pt:"2 Portionen",t:"20 Min",note:"Nimm Gemüse-Maultaschen ohne Schwein (Packung prüfen).",z:["360 g Gemüse-Maultaschen","Ölspray","125 g Mini-Mozzarella light","2 Romanasalat-Herzen","1 Handvoll Tomaten","Etwas Gurke","Etwas rote Zwiebel","Dressing: 150 g griechischer Joghurt 2 %","Dressing: 60 g Miracel Whip Balance","Dressing: 1 EL Essig","Dressing: 1 Knoblauchzehe","Dressing: Salz, Pfeffer, Spritzer Zuckersirup oder 1 TL Zuckerersatz"],s:["Salat in Streifen schneiden und waschen. Tomaten würfeln, Gurke und Zwiebel in feine Ringe schneiden.","Maultaschen in Streifen schneiden, mit Ölspray besprühen und im Airfryer bei 180 °C 8–10 Min. knusprig backen (alternativ Ofen oder Pfanne).","Mozzarellakugeln halbieren, Dressing aus allen Zutaten verrühren und gut würzen.","Salat, Tomate, Gurke, Zwiebel, Mozzarella und Dressing mischen, die knusprigen Maultaschen dazugeben."]},
{id:"I29",q:"Instagram (Account im Screenshot nicht sichtbar)",c:"Hauptmahlzeit (16 Uhr)",n:"Gnocchi-Bowl mit Hähnchenaufschnitt und Senf-Joghurt-Dressing",k:410,p:28,t:"20 Min",note:"Nährwerte stehen nicht im Post, von mir geschätzt.",z:["100 g Gnocchi","100 g Hähnchenaufschnitt","100 g Salatgurke","100 g Cherrytomaten","60 g Mais","Eisbergsalat","Zwiebel","Ölspray, Paprikapulver","Dressing: 40 g Joghurt 0,1 % Fett","Dressing: 20 g Miracel Whip Balance","Dressing: 5 g Senf mittelscharf","Dressing: etwas Zitrone, Petersilie, etwas Süße (z. B. Zuckerersatz), Pfeffer, Salz"],s:["Gnocchi mit Ölspray besprühen, mit Paprikapulver würzen und bei 200 °C 10 Min. im Airfryer backen.","Hähnchenaufschnitt, Salat, Gurke, Zwiebel und Tomaten klein schneiden.","Alles in eine Schale geben, Mais und die fertigen Gnocchi dazugeben.","Dressing-Zutaten vermengen und die Bowl damit toppen."]},
{id:"I30",q:"hassan_der_foodie",c:"Hauptmahlzeit (16 Uhr)",n:"Gefüllte Zucchini mit Hackfleisch",k:410,p:28,u:"pro Portion (2 Portionen angenommen)",pt:"ca. 2 Portionen",t:"40 Min",note:"Der Post nennt weder Backtemperatur noch Menge Käse, ich habe 200 °C und ca. 40 g Käse angenommen. Nimm Rinderhack. Nährwerte von mir geschätzt. Dazu passt Reis oder Kartoffeln.",z:["1 große Zucchini","40 g Cheddarkäse","300 g gewürfelte Tomaten (Dose)","Salz, Pfeffer","Füllung: 200 g Rinderhack","Füllung: 1 Zwiebel","Füllung: 1 EL Tomatenmark","Füllung: jeweils ½ TL Salz, Pfeffer und Paprikapulver","Füllung: 1 Knoblauchzehe","Füllung: 2 EL Olivenöl"],s:["Zucchini der Länge nach halbieren und mit einem Löffel aushöhlen.","Zwiebel und Knoblauch in Olivenöl anbraten, Hack dazugeben und kräftig anbraten. Tomatenmark und Gewürze unterrühren.","Gewürfelte Tomaten in eine Auflaufform geben, Zucchinihälften hineinlegen und mit der Hackmasse füllen. Käse darüberstreuen.","Bei ca. 200 °C 20–25 Min. im Ofen backen."]},
{id:"I31",q:"schmale… (Name abgeschnitten)",c:"Hauptmahlzeit (16 Uhr)",mp:"Meal-Prep: 3 Tage Kühlschrank",n:"Ofenpasta mit Gemüse und Tomatenfrischkäse",w:0.5,k:726,p:32,u:"pro Portion (110 g Carbs)",pt:"2 Portionen",t:"50 Min",note:"Im Post ist die Anleitung abgeschnitten (nur 30–40 Min. bei 180 °C Umluft). Ablauf von mir ergänzt.",z:["250 g Nudeln","3 Möhren","1 rote Paprika","1 orange Paprika","1 Knolle Knoblauch","1 rote Zwiebel","3 Fleischtomaten","2 TL Olivenöl","1 Packung Tomatenfrischkäse","10 g Parmesan","Salz, Pfeffer, Basilikum, Oregano"],s:["Möhren, Paprika, Zwiebel und Tomaten in Stücke schneiden, Knoblauchknolle halbieren. Alles in eine Form geben, mit Olivenöl, Salz, Pfeffer, Basilikum und Oregano würzen.","Bei 180 °C Umluft 30–40 Min. im Ofen backen.","Nudeln nach Packungsbeilage kochen.","Knoblauch ausdrücken, mit dem Tomatenfrischkäse unter das Gemüse mischen, Nudeln unterheben und mit Parmesan bestreuen."]},
{id:"I32",q:"Instagram (Account im Screenshot nicht sichtbar)",c:"Hauptmahlzeit (16 Uhr)",n:"Cremiges Hähnchen aus der Auflaufform",k:260,p:34,u:"pro Portion (10 g Fett, 6 g Carbs)",pt:"2 Portionen",t:"35 Min",note:"Dazu passt Reis oder Kartoffeln (nicht in den Nährwerten, mit 80 g Reis roh ca. +280 kcal).",z:["260 g Hähnchenbrust","70 g Frischkäse (Knoblauch und Thymian)","40 g Zwiebel","25 g Sahne","95 ml Wasser","60 ml Milch 1,5 %","5 g Senf","4 g Speisestärke","Salz, Pfeffer, Paprikapulver, Petersilie"],s:["Hähnchen von beiden Seiten scharf anbraten, mit Paprikapulver würzen und die Zwiebeln dazugeben.","Frischkäse, Sahne, Wasser, Milch, Senf, Speisestärke, Salz und Pfeffer miteinander verquirlen.","Hähnchen mit der Soße in eine Auflaufform geben.","20–25 Min. bei 180 °C Heißluft backen (zwischendurch testen, ob es gar ist). Mit Petersilie bestreuen."]},
{id:"I33",q:"Instagram (Account im Screenshot nicht sichtbar)",c:"Hauptmahlzeit (16 Uhr)",n:"After-Gym Kartoffel-Hack-Bowl mit Dill-Joghurt",w:0.5,k:595,p:55,u:"pro Portion (von mir geschätzt)",pt:"2 Portionen",t:"35 Min",note:"Im Original vegetarisches Hack, hier Rinderhack (vegetarisch geht auch). Nährwerte stehen nicht im Post, von mir mit Rinderhack und Skyr geschätzt.",z:["500 g Kartoffeln","2 EL Olivenöl","350 g Rinderhack (alternativ vegetarisches Hack)","1 Zwiebel","1 Knoblauchzehe","2 EL Tomatenmark","150 g passierte Tomaten","200 g griechischer Joghurt oder Skyr","1 Frühlingszwiebel","Frische Petersilie, Dill","Salz, Pfeffer, Paprikapulver, optional Chili"],s:["Kartoffeln in kleine Würfel schneiden, mit 1 EL Olivenöl, Salz, Pfeffer und Paprikapulver mischen und bei 190 °C im Airfryer oder Backofen 20–25 Min. knusprig backen.","Zwiebel und Knoblauch fein hacken und mit dem Hack in etwas Öl anbraten, mit Salz, Pfeffer und Paprikapulver würzen.","Tomatenmark kurz mitrösten, mit den passierten Tomaten ablöschen und 5 Min. köcheln lassen.","Joghurt mit gehackter Petersilie (und Dill), Salz und Pfeffer verrühren.","Kartoffeln und Joghurt in die Bowl geben, Hack darauf verteilen und mit Frühlingszwiebeln toppen."]},
{id:"I34",q:"Instagram (Account im Screenshot nicht genannt)",c:"Hauptmahlzeit (16 Uhr)",n:"High-Protein Mini-Flammkuchen mit Skyr-Teig",k:817,p:58,u:"gesamt, 8 Mini-Flammkuchen (107 g Carbs)",pt:"1 Portion (8 Mini-Flammkuchen)",t:"35 Min",note:"Die Speckmenge (ca. 100 g) habe ich so berechnet, dass die 58 g Eiweiß stimmen. Backzeit und Temperatur stehen im Post nicht, die habe ich ergänzt. Mit Schweine-Speck, nur für dich. Wenn deine Freundin mitisst: Putenschinken- oder Putenbacon-Würfel.",z:["140 g weißes Dinkelmehl","170 g Skyr","1 TL Backpulver","1 Prise Salz","70 g Cremefresh light","100 g Light-Speckwürfel","1 kleine Zwiebel","Schnittlauch oder Lauchzwiebel"],s:["Mehl, Skyr, Backpulver und Salz in einer Schüssel zu einem glatten Teig verkneten (ca. 2 Min.). Wenn er zu klebrig ist, etwas Mehl dazugeben.","Teig in 8 gleich große Stücke teilen, zu dünnen Mini-Fladen (ca. 10 cm) ausrollen oder flach drücken und auf ein Blech mit Backpapier legen.","Mit Cremefresh bestreichen, Zwiebel in feine Ringe oder Würfel schneiden und mit den Speckwürfeln darauf verteilen.","Bei 220 °C Ober-/Unterhitze 12–15 Min. backen, bis die Ränder goldbraun sind (im Airfryer bei 190 °C 8–10 Min. in 2 Chargen).","Mit Schnittlauch oder Lauchzwiebel bestreuen."]},
{id:"I35",q:"Video von @abbasmomo",c:"Dessert",n:"Protein-Schoko-Croissants (Quark-Dinkel-Teig)",k:291,p:14,u:"pro Croissant (43 g Carbs, 7 g Fett)",pt:"ca. 8 Croissants",ns:true,t:"45 Min",note:"Die Anleitung steht nicht im Post, Teigverarbeitung, Temperatur und Backzeit habe ich ergänzt. Für den Teig kannst du Quark und Mehl auch länger kneten, wenn er zu klebrig ist (etwas Mehl dazu).",z:["500 g Magerquark","350 g Dinkelmehl","150 g Zartbitterschokodrops","2 TL Backpulver","1 Eigelb","Vanillearoma"],s:["Quark, Mehl, Backpulver und Vanillearoma zu einem glatten Teig verkneten. Wenn er zu klebrig ist, etwas Mehl dazugeben.","Teig zu einem Kreis ausrollen und in 8 Dreiecke schneiden.","Schokodrops auf die breite Seite der Dreiecke streuen und zu Croissants einrollen.","Mit verquirltem Eigelb bestreichen.","Bei 180 °C Ober-/Unterhitze 20–25 Min. backen, bis sie goldbraun sind (im Airfryer bei 170 °C 12–15 Min. in 2–3 Chargen)."]}];

{id:"E1",q:"Eure Favoriten",c:"Hauptmahlzeit (16 Uhr)",n:"Gnocchi in Tomatenmark-Sahne-Soße",k:575,p:18,t:"20 Min",note:"Werte geschätzt. Eiweiß-Tipp: 200 g Hähnchen dazu (+220 kcal, +46 g Eiweiß).",z:["250 g Gnocchi","1 Knoblauchzehe","½ Zwiebel","1 EL Tomatenmark","100 ml Kochsahne 7 %","1 TL Öl","Optional: 15 g Parmesan oder Reibekäse"],s:["Knoblauch und Zwiebel in Öl kurz anbraten, dann die Gnocchi dazugeben. 1 EL Tomatenmark darauf geben, umrühren und weiter braten.","Wenn alles vermengt und angebraten ist, die Sahne dazugeben und kurz aufkochen. Dann ist es fertig.","Optional Parmesan oder Reibekäse darüberstreuen."]},
{id:"E2",q:"Eure Favoriten",c:"Hauptmahlzeit / 12-Uhr-Pause (kalt)",n:"Reis-Bowl nach Wahl mit Halloumi, Hummus und Avocado",k:900,p:31,t:"25 Min",note:"Individuell: nimm, was ihr mögt. Das ist eine große Portion. Für weniger Kalorien Hummus oder Avocado halbieren. Mehr Eiweiß: 200 g Hähnchen statt Halloumi. Werte geschätzt.",z:["60 g Reis (roh)","100 g Salat (z. B. Romana oder Eisberg)","100 g Gurke","100 g Tomaten","1 Paprika","30 g getrocknete Tomaten (abgetropft)","½ Avocado","40 g Hummus","80 g Halloumi","Dressing: 2 TL Olivenöl","Dressing: 1 EL Zitronensaft"],s:["Reis nach Packungsbeilage kochen und abkühlen lassen oder warm verwenden.","Halloumi in Scheiben schneiden und im Airfryer bei 200 °C 6–8 Min. goldbraun backen (oder in der Pfanne braten).","Salat, Gurke, Tomaten, Paprika und getrocknete Tomaten klein schneiden.","Dressing aus Olivenöl und Zitronensaft anrühren und mit dem Salat und dem Gemüse mischen.","Reis in die Bowl geben, Salat, Hummus, Avocado und Halloumi darauf verteilen."]},
{id:"E3",q:"Eure Favoriten",c:"Hauptmahlzeit (16 Uhr)",n:"Kartoffelgratin",k:560,p:22,t:"45 Min",note:"Werte geschätzt. Eiweiß-Tipp: 200 g Hähnchen im Airfryer dazu (+220 kcal, +46 g Eiweiß).",z:["400 g Kartoffeln (festkochend)","150 ml Kochsahne 7 %","40 g Reibekäse (Streukäse) light","5 g Speisestärke","Salz, Pfeffer, Muskat (wenig)"],s:["Kartoffeln schälen und in dünne Scheiben hobeln.","Sahne in einen Topf geben, mit Salz, Pfeffer und wenig Muskat würzen und aufkochen. Wenn sie etwas dicker werden soll, Speisestärke vorher in einem kleinen Schüsselchen mit Wasser verrühren und erst dann in die Sahne geben.","Kartoffelscheiben in den Topf geben, vermengen und 2–3 Min. in der Soße ziehen lassen, damit sie etwas weich werden.","Alles in eine Auflaufform füllen und in den Airfryer stellen (ca. 180 °C, 25–30 Min.). 10 Min. vor Ende den Streukäse verteilen und fertig backen."]},
{id:"E4",q:"Eure Favoriten",c:"Hauptmahlzeit (16 Uhr)",n:"Hähnchen-Gyros im Fladenbrot mit Zaziki",k:657,p:67,t:"25 Min",note:"Statt Hähnchen geht auch Halloumi (ca. 100 g, +100 kcal, ca. 25 g weniger Eiweiß). Werte geschätzt.",z:["100 g Fladenbrot","200 g Hähnchenbrust","1 EL Gyrosgewürz","1 TL Öl","1 Tomate","½ Zwiebel","1 TL Olivenöl","1 EL Zitronensaft","Salz","Zaziki: 100 g Skyr","Zaziki: 50 g Gurke","Zaziki: 1 Knoblauchzehe","Zaziki: Dill, Salz, Pfeffer"],s:["Hähnchen in Streifen schneiden, mit Gyrosgewürz und Öl mischen und im Airfryer bei 180 °C 10–12 Min. garen, einmal schütteln.","Zaziki: Gurke raspeln und ausdrücken, mit Skyr, Knoblauch, Dill, Salz und Pfeffer verrühren.","Tomate und Zwiebel klein schneiden, in einer Schüssel mit Olivenöl, Zitronensaft und Salz vermengen.","Fladenbrot im Airfryer 2 Min. wärmen und aufschneiden.","Mit Zaziki, Hähnchen und der Tomaten-Zwiebel-Mischung füllen."]},
{id:"E5",q:"Eure Favoriten",c:"Hauptmahlzeit / 12-Uhr-Pause (kalt)",n:"Nudelsalat mit getrockneten Tomaten, Parmesan und Pinienkernen",k:490,p:22,t:"20 Min",note:"Gut für die Arbeit, schmeckt auch kalt. Werte geschätzt. Eiweiß-Tipp: 200 g Hähnchen dazu (+220 kcal, +46 g Eiweiß).",z:["80 g Nudeln (roh)","30 g getrocknete Tomaten (in Öl, nicht abtropfen lassen)","20 g Parmesan","10 g Pinienkerne","50 g Rucola oder Salat","Salz, Pfeffer"],s:["Nudeln nach Packungsbeilage kochen, abgießen und abkühlen lassen.","Pinienkerne ohne Fett kurz anrösten.","Nudeln mit den getrockneten Tomaten (das anhaftende Öl reicht, kein zusätzliches Öl nötig), Salat, Parmesan und Pinienkernen mischen, mit Salz und Pfeffer abschmecken."]},
{id:"E6",q:"Eure Favoriten",c:"Hauptmahlzeit (16 Uhr)",n:"Nudel-Schafskäse aus dem Airfryer",k:740,p:33,t:"35 Min",note:"Temperatur (200 °C) und Zeit (höchstens 20 Min.) sind für den Airfryer. Werte geschätzt, mit Light-Schafskäse ca. 120 kcal weniger. Eiweiß-Tipp: 200 g Hähnchen dazu (+220 kcal, +46 g Eiweiß).",z:["100 g Nudeln (roh)","100 g Schafskäse (Block)","250 g Cherrytomaten","1 TL Olivenöl","5 g Butter","1 TL Café-de-Paris-Gewürz"],s:["Tomaten halbieren und in eine ofenfeste Schale (Airfryer-geeignet) geben, den Schafskäse als Block in die Mitte legen.","Mit etwas Olivenöl beträufeln und im Airfryer bei 200 °C ca. 20 Min. (höchstens) backen, dann herausnehmen und den Schafskäse mit den Tomaten zerdrücken.","Nudeln nach Packungsbeilage kochen, abgießen und noch warm mit der Butter und dem Café-de-Paris-Gewürz vermengen.","Den zerdrückten Schafskäse mit den Tomaten auf die Nudeln geben und alles verrühren."]},
{id:"E7",q:"Eure Favoriten",c:"Beilage",n:"Gurkensalat mit Skyr",k:165,p:20,t:"10 Min",note:"Als Beilage zu Hähnchen, Kartoffeln oder Gyros. Werte geschätzt.",z:["300 g Gurke","150 g Skyr (oder Joghurt oder Schmand)","1 TL Gurkensalat-Fix (oder Essig, Salz, Zucker)","1 EL Balsamico","Dill","Salz, Pfeffer"],s:["Gurke hobeln, salzen und 10 Min. ziehen lassen, dann ausdrücken.","Skyr mit Gurkensalat-Fix, Balsamico, Dill, Salz und Pfeffer verrühren und mit der Gurke mischen."]},
{id:"E8",q:"Eure Favoriten",c:"Hauptmahlzeit (16 Uhr)",n:"Flammkuchen mit Lauch und Putenschinken",k:665,p:44,t:"25 Min",note:"Mit Putenschinken statt Schweineschinken. Werte geschätzt und abhängig vom Teig.",z:["130 g Flammkuchenteig (ca. ½ Packung)","100 g Frischkäse light (oder Schmand)","50 g Lauch","½ Zwiebel","40 g Reibekäse light","60 g Putenschinken","Pfeffer"],s:["Teig ausrollen oder ausbreiten.","Frischkäse mit Pfeffer würzen und auf dem Teig verstreichen.","Lauch, Zwiebel, Putenschinken und Käse darauf verteilen.","Bei 220 °C Ober-/Unterhitze 10–12 Min. backen (oder in Stücken im Airfryer bei 200 °C 6–8 Min.)."]},
{id:"E9",q:"Eure Favoriten",c:"Hauptmahlzeit (16 Uhr)",n:"Gebratene Nudeln mit Ei und Gemüse",k:790,p:34,t:"20 Min",note:"Werte geschätzt. Eiweiß-Tipp: 200 g Hähnchen dazu (+220 kcal, +46 g Eiweiß).",z:["100 g asiatische Nudeln (Mie, roh)","3 Eier","150 g Gemüse (Karotten, Sojasprossen, Bambus)","2 Lauchzwiebeln","2 EL Sojasauce","2 EL Öl (immer wieder etwas nachgeben)"],s:["Die Nudeln nur kurz in heißem Wasser einweichen, bis sich der Block löst, und sofort abgießen.","Karotten, Sojasprossen und Bambus zuerst in Öl braten. Immer wieder etwas Öl nachgeben, damit nichts kleben bleibt, und ständig umrühren.","Dann die Lauchzwiebeln dazugeben und die Nudeln untermischen.","Sojasauce darübergeben.","Zum Schluss die 3 Eier dazugeben und schön unter die Nudeln rühren, bis sie gestockt sind."]},
{id:"E10",q:"Eure Favoriten",c:"Hauptmahlzeit (16 Uhr)",n:"Hackfleischbällchen-Auflauf in Tomatensoße",k:490,p:54,t:"35 Min",note:"Dazu passen Reis, Brot oder Kartoffeln (nicht in den Nährwerten). Werte geschätzt.",z:["200 g Rinderhack (mager)","½ Zwiebel","300 g Tomatensoße (passierte Tomaten)","30 g Reibekäse light","1 Knoblauchzehe","1 TL Öl","Salz, Pfeffer, Oregano"],s:["Hack mit gewürfelter Zwiebel, Salz und Pfeffer vermengen und zu kleinen Bällchen formen.","Bällchen im Airfryer bei 180 °C 8–10 Min. vorgaren (oder in Öl anbraten).","Bällchen in eine Auflaufform legen, mit Tomatensoße, Knoblauch und Oregano übergießen, Käse darüber.","Bei 200 °C Ober-/Unterhitze 15–20 Min. überbacken (oder im Airfryer bei 180 °C 12–15 Min.)."]},
{id:"E11",q:"Eure Favoriten",c:"Hauptmahlzeit (16 Uhr)",n:"Curry-Gemüse-Pfanne mit Reis",k:505,p:12,t:"25 Min",note:"Werte geschätzt (Frosta-Curry ohne Hähnchen). Eiweiß-Tipp: 200 g Hähnchen dazu (+220 kcal, +46 g Eiweiß).",z:["½ Beutel Frosta Gemüse-Curry (ca. 225 g, ohne Hähnchen)","1 Paprika","100 ml Kokosmilch light","1 TL gelbe Currypaste","70 g Reis (roh)","5 g Speisestärke","Salz, Pfeffer"],s:["Reis nach Packungsbeilage kochen.","Paprika in Stücke schneiden und kurz in der Pfanne anbraten.","Frosta-Curry, Currypaste und Kokosmilch zugeben und 8–10 Min. köcheln lassen.","Speisestärke mit kaltem Wasser verrühren, einrühren und kurz aufkochen, bis die Soße dicker wird. Auf Reis servieren."]}];

   const m=p.match(/^(½|\d+(?:[.,]\d+)?)\s*(?:(g|ml|EL|TL|Scheiben|Scheibe|Scoop|Tasse)\s+)?(.+)$/);
   if(!m){if(/ketchup/i.test(p))vor.add("Ketchup");if(SPICE.test(p.toLowerCase()))return;const c=classify(p);
    if(c){if(c.c===VO)vor.add(c.l);else need[c.c+"|"+c.l]=1;}else if(p.length<=30)vor.add(p);return;}
   let q=m[1]==="½"?0.5:parseFloat(m[1].replace(",","."));let u=m[2]||"Stk";const rest=m[3].split(",")[0];let c=classify(rest);
   if(!c){if(!r.cust)return;c={c:TR,l:rest.trim()};}
   if(c.c===VO){vor.add(c.l);return;}
   if(u==="EL"||u==="TL"||u==="Tasse"){if(c.l!=="Skyr"&&c.l!=="Magerquark")vor.add(c.l);return;}
   if(u==="Scoop"){q*=30;u="g";}
   if(u==="Scheibe"||u==="Scheiben"){if(c.l==="Putenaufschnitt"){q*=15;u="g";}else u="Scheiben";}
   if(c.l==="Tomaten"&&u==="Stk"){q*=120;u="g";}
   if(c.l==="Paprika"&&u==="g"){q/=150;u="Stk";}
   if(c.l==="Gurken"&&u==="g"){q/=300;u="Stk";}
   if(c.l==="Zwiebeln"&&u==="g"){q/=100;u="Stk";}
   const key=c.c+"|"+c.l+"|"+u;items[key]=(items[key]||0)+q*f;}));}
 const out={};CATS.forEach(c=>out[c]=[]);const have=new Set();
 Object.keys(items).sort().forEach(k=>{const[c,l,u]=k.split("|");have.add(c+"|"+l);let q,sub="";
   if(PACK[l]&&u==="g"){const np=Math.ceil(items[k]/PACK[l]-0.001);q=np+(np===1?" Packung":" Packungen")+" à "+PACK[l]+" g";sub="gebraucht ca. "+fmt(items[k],u);}
   else q=fmt(items[k],u);
   out[c].push({key:k,l,q,sub});});
 Object.keys(need).forEach(k=>{if(!have.has(k)&&!(k.endsWith("|Salat")&&need[G+"|Salat / Tomate / Gurke"])){const[c,l]=k.split("|");out[c].push({key:k,l,q:"nach Bedarf",sub:""});}});
 return {out,vor:[...vor].sort()};
}

const LCAT={}, _lab={};
function labelsOf(id){
  if(_lab[id]) return _lab[id];
  const r=all[id], set=new Set();
  r.z.forEach(zs=>zs.split(/,\s+(?=[\d½])/).forEach(p=>{
    p=p.trim().replace(/^[A-Za-zÄÖÜäöüß\- ]+:\s*/,"");
    const m=p.match(/^(½|\d+(?:[.,]\d+)?)\s*(?:(g|ml|EL|TL|Scheiben|Scheibe|Scoop|Tasse)\s+)?(.+)$/);
    if(m&&(m[2]==="EL"||m[2]==="TL"||m[2]==="Tasse")) return;
    if(!m&&SPICE.test(p.toLowerCase())) return;
    const c=classify(m?m[3].split(",")[0]:p);
    if(c&&c.c!==VO){set.add(c.l);LCAT[c.l]=c.c;}else if(!c&&r.cust){const nm=(m?m[3]:p).split(',')[0].trim();if(nm){set.add(nm);LCAT[nm]=TR;}}
  }));
  return _lab[id]=[...set];
}

/* ---------- Kopf: Tagebuch + Haushalt ---------- */
const ICJ='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h11a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H6z"/><path d="M6 3.5v17M10 8h5M10 12h5"/></svg>';
const ICH='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9" r="2.2"/><path d="M16 14c2.5-.3 4.5 1.2 4.5 4"/></svg>';
document.querySelector(".ic").insertAdjacentHTML("beforeend",'<button id="bdy" aria-label="Tagebuch">'+ICJ+'</button><button id="bhh" aria-label="Haushalt teilen">'+ICH+'</button>');

/* ---------- Eigene Rezepte ---------- */
const CGRP={"Frühstück":"Frühstück","Hauptmahlzeit":"Hauptmahlzeit (16 Uhr)","Snack & Beilage":"Snack / Pause","Dessert":"Dessert"};
function crHtml(id){
  const r=id?all[id]:null, g=r?grp(r):"Hauptmahlzeit";
  return `<div class="dtop"><div class="in"><button class="back" data-pc>Abbrechen</button></div></div>
  <div class="dbody"><h2>${r?"Rezept bearbeiten":"Eigenes Rezept"}</h2>
  <p class="note" style="margin-top:0">Zutaten und Mengen gelten für 2 Personen, genau so wie du sie eintippst. Kalorien und Eiweiß pro Person.</p>
  <div class="frm">
   <label class="full">Name<input id="cr-n" value="${esc(r?r.n:"")}" placeholder="z. B. Hähnchen-Reis-Pfanne"></label>
   <label class="full">Art<select id="cr-g">${Object.keys(CGRP).map(x=>`<option${x===g?" selected":""}>${x}</option>`).join("")}</select></label>
   <label>kcal pro Person<input id="cr-k" inputmode="numeric" value="${r?r.k:""}" placeholder="600"></label>
   <label>Eiweiß (g)<input id="cr-p" inputmode="numeric" value="${r?r.p:""}" placeholder="45"></label>
   <label class="full">Zeit<input id="cr-t" value="${esc(r?r.t:"")}" placeholder="25 Min"></label>
   <label class="full">Zutaten, eine pro Zeile<textarea id="cr-z" placeholder="400 g Hähnchenbrust&#10;200 g Reis (roh)&#10;1 Paprika&#10;Salz, Pfeffer">${esc(r?r.z.join("\n"):"")}</textarea></label>
   <label class="full">Zubereitung, ein Schritt pro Zeile<textarea id="cr-s" placeholder="Reis kochen.&#10;Hähnchen würfeln und anbraten.">${esc(r?r.s.join("\n"):"")}</textarea></label>
  </div>
  <div class="stack"><button class="btn pri" data-crsave="${id||""}">Speichern</button></div></div>`;
}
function openCr(id){pm="C";pnl.innerHTML=crHtml(id);pnl.hidden=false;pnl.scrollTop=0;}
function saveCr(id){
  const n=$("#cr-n").value.trim(); if(!n){toast("Bitte einen Namen eintragen");return}
  const lines=s=>$(s).value.split("\n").map(x=>x.trim()).filter(Boolean);
  const z=lines("#cr-z"), s=lines("#cr-s"); if(!z.length){toast("Bitte Zutaten eintragen");return}
  const num=v=>Math.max(0,Math.round(parseFloat(String(v).replace(",","."))||0));
  const rec={id:id||("X"+(1+Math.max(0,...ST.cust.map(c=>parseInt(c.id.slice(1)))))),n,c:CGRP[$("#cr-g").value],k:num($("#cr-k").value),p:num($("#cr-p").value),t:$("#cr-t").value.trim()||"–",z,s:s.length?s:["Nach Belieben zubereiten."],ns:true,pt:"für 2 Personen",cust:1};
  const i=ST.cust.findIndex(c=>c.id===rec.id); if(i>=0) ST.cust[i]=rec; else ST.cust.push(rec);
  rebuildAll(); persist(); closePanel(); if(openId) redrawDetail(); toast("Rezept gespeichert");
}
const _rh=recipesHtml;
recipesHtml=function(){return _rh().replace('<div id="list">','<button class="btn" id="newrec" style="width:100%;margin-bottom:10px">Eigenes Rezept anlegen</button><div id="list">');};
const _dh=detailHtml;
detailHtml=function(id){
  const r=all[id]; let x=`<div class="drow"><button class="btn" data-dyadd="${id}">Heute gegessen</button></div>`;
  if(r.cust) x+=`<div class="drow"><button class="btn" data-cred="${id}">Bearbeiten</button><button class="btn warn" data-crdel="${id}">Löschen</button></div>`;
  return _dh(id).replace(/<\/div><\/div>$/,"</div>"+x+"</div>");
};

/* ---------- Tagebuch (persönlich, nur auf diesem Handy) ---------- */
const DLS="kochplaner.diary.v1";
let DY={goal:{k:2100,p:150},days:{},foods:[]};
try{const o=JSON.parse(localStorage.getItem(DLS)); if(o&&o.days) DY=o;}catch(e){}
const dsave=()=>{try{localStorage.setItem(DLS,JSON.stringify(DY))}catch(e){}};
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let dyk=dkey(new Date()), dyq="";
const dlabel=k=>{const t=dkey(new Date());if(k===t)return"Heute";const y=new Date();y.setDate(y.getDate()-1);if(k===dkey(y))return"Gestern";const [a,b,c]=k.split("-");return c+"."+b+"."+a;};
const f1=n=>String(Math.round(n*10)/10).replace(".",",");
function tot(k){const e=DY.days[k]||[];return{k:e.reduce((a,x)=>a+x.k*x.m,0),p:e.reduce((a,x)=>a+x.p*x.m,0)};}
function addEntry(e,k){const key=k||dyk;(DY.days[key]||(DY.days[key]=[])).push(Object.assign({m:1},e));
  const keys=Object.keys(DY.days).sort(); while(keys.length>400) delete DY.days[keys.shift()]; dsave();}
function barHtml(v,g){const pct=g?Math.min(100,v/g*100):0;return `<div class="bar${v>g?" over":""}"><i style="width:${pct}%"></i></div>`;}
function dyResHtml(){
  const q=dyq.trim().toLowerCase(); let rows;
  if(q) rows=ALL.filter(r=>(r.n+" "+r.id).toLowerCase().includes(q)).slice(0,8);
  else{const seen=new Set();rows=[];Object.keys(DY.days).sort().reverse().forEach(d=>DY.days[d].slice().reverse().forEach(e=>{if(e.rid&&all[e.rid]&&!seen.has(e.rid)&&rows.length<6){seen.add(e.rid);rows.push(all[e.rid]);}}));}
  if(!rows.length) return '<p class="empty">'+(q?"Kein Rezept gefunden.":"Suche ein Rezept, dann tippst du es an.")+"</p>";
  return `<div class="box">`+rows.map(r=>`<button class="ck" data-dyr="${r.id}" style="grid-template-columns:1fr auto"><span class="l">${esc(r.n)}<small>${r.k} kcal · ${r.p} g Eiweiß pro Person</small></span><span class="q">+ 1 Portion</span></button>`).join("")+`</div>`;
}
function dyHtml(){
  const t=tot(dyk), G=DY.goal, ents=DY.days[dyk]||[];
  const days=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(dkey(d));}
  return `<div class="dtop"><div class="in"><button class="back" data-pc>Schließen</button><span class="wk">Nur auf diesem Handy gespeichert</span></div></div>
  <div class="dbody"><h2>Tagebuch</h2>
  <div class="dnav"><button data-dyd="-1" aria-label="Vorheriger Tag">‹</button><b>${dlabel(dyk)}</b><button data-dyd="1" aria-label="Nächster Tag">›</button></div>
  <div class="tot"><div><div class="row1"><b>${Math.round(t.k)} kcal</b><span>Ziel ${G.k} · noch ${Math.round(G.k-t.k)}</span></div>${barHtml(t.k,G.k)}</div>
   <div><div class="row1"><b>${f1(t.p)} g Eiweiß</b><span>Ziel ${G.p} · noch ${f1(G.p-t.p)}</span></div>${barHtml(t.p,G.p)}</div></div>
  <h3 class="sec">Gegessen</h3>
  ${ents.length?`<div class="box">`+ents.map((e,i)=>`<div class="ent"><b>${esc(e.n)}</b><span class="meta">${Math.round(e.k*e.m)} kcal · ${f1(e.p*e.m)} g Eiweiß</span><div class="eac"><button data-dym="${i}:-0.5" aria-label="Weniger">−</button><span>${f1(e.m)}×</span><button data-dym="${i}:0.5" aria-label="Mehr">+</button><button data-dyx="${i}" aria-label="Löschen">×</button></div></div>`).join("")+`</div>`:'<p class="empty">An diesem Tag ist noch nichts eingetragen.</p>'}
  <h3 class="sec">Rezept eintragen</h3>
  <input id="dyq" class="finp" type="search" placeholder="Rezept suchen" value="${esc(dyq)}" aria-label="Rezept suchen"><div id="dyres">${dyResHtml()}</div>
  <h3 class="sec">Eigener Eintrag</h3>
  <div class="frm"><label class="full">Name<input id="dy-n" placeholder="z. B. Kantine Pommes"></label>
   <label>kcal<input id="dy-k" inputmode="numeric" placeholder="450"></label><label>Eiweiß (g)<input id="dy-p" inputmode="decimal" placeholder="5"></label>
   <label class="chk2 full"><input type="checkbox" id="dy-s" checked>In „Meine Lebensmittel“ merken</label>
   <button class="btn pri full" data-dyown>Eintragen</button></div>
  ${DY.foods.length?`<h3 class="sec">Meine Lebensmittel</h3><div class="box">`+DY.foods.map((f,i)=>`<div class="ent"><b>${esc(f.n)}</b><span class="meta">${f.k} kcal · ${f1(f.p)} g Eiweiß</span><div class="eac"><button data-dyf="${i}" aria-label="Heute eintragen" style="width:auto;padding:0 12px">+ Heute</button><button data-dyfx="${i}" aria-label="Aus der Liste löschen">×</button></div></div>`).join("")+`</div>`:""}
  <h3 class="sec">Letzte 7 Tage</h3>
  <div class="box">${days.map(d=>{const x=tot(d);return `<div class="wk7"><span>${esc(dlabel(d).slice(0,6))}</span><span>${barHtml(x.k,G.k)}</span><span>${Math.round(x.k)} kcal · ${Math.round(x.p)} g</span></div>`}).join("")}</div>
  <h3 class="sec">Tagesziel</h3>
  <div class="frm"><label>kcal<input id="dg-k" inputmode="numeric" value="${G.k}"></label><label>Eiweiß (g)<input id="dg-p" inputmode="numeric" value="${G.p}"></label></div>
  </div>`;
}
function drawDy(keep){const y=pnl.scrollTop;pnl.innerHTML=dyHtml();pnl.scrollTop=keep?y:0;}
function openDy(){pm="Y";dyq="";dyk=dkey(new Date());drawDy(false);pnl.hidden=false;}

/* ---------- Haushalt und Live-Abgleich ---------- */
const HK="kochplaner.hh";
let HH=null; try{HH=JSON.parse(localStorage.getItem(HK));}catch(e){}
const hsave=()=>{try{localStorage.setItem(HK,JSON.stringify(HH))}catch(e){}};
const hm=(location.hash||"").match(/h=([a-z0-9]{16,64})/i);
if(hm){HH={mode:"cloud",code:hm[1].toLowerCase()};hsave();try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
const SH=["sel","sc","fr","cust"];
let fbRef=null,unsub=null,last={},syncState="off";
function chip(){const b=$("#bhh");if(!b)return;b.classList.toggle("sync",syncState==="online");b.classList.toggle("err",syncState==="error");}
function stopSync(){if(unsub){unsub();unsub=null}fbRef=null;last={};syncState="off";chip();}
function startSync(){
  if(!window.FB||!HH||HH.mode!=="cloud"||!HH.code) return; stopSync();
  fbRef=FB.doc(FB.db,"households",HH.code);
  unsub=FB.onSnapshot(fbRef,snap=>{
    if(snap.metadata.hasPendingWrites) return;
    syncState=snap.metadata.fromCache?"off":"online"; chip();
    if(!snap.exists()){if(!snap.metadata.fromCache)pushShared(true);return}
    applyRemote(snap.data());
  },()=>{syncState="error";chip();});
}
function applyRemote(d){
  let ch=false,cust=false;
  SH.forEach(k=>{const s=d[k+"S"]; if(typeof s==="string"&&s!==last[k]){last[k]=s;try{ST[k]=JSON.parse(s);ch=true;if(k==="cust")cust=true;}catch(e){}}});
  if(!ch) return;
  try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}
  if(cust) rebuildAll();
  const a=document.activeElement; if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")) return;
  if(openId) redrawDetail(); else if(pnl.hidden) render(); else if(pm==="F") refreshFridge();
}
flush=function(){pushShared(false);};
function pushShared(force){
  if(!fbRef) return;
  if(saving){dirty=true;return}
  const o={},sent=[];
  SH.forEach(k=>{const s=JSON.stringify(ST[k]||(k==="cust"?[]:{})); if(force||s!==last[k]){o[k+"S"]=s;sent.push(k);last[k]=s;}});
  if(!sent.length) return;
  o.u=Date.now(); saving=true;
  FB.setDoc(fbRef,o,{merge:true}).catch(()=>{sent.forEach(k=>{last[k]=undefined});syncState="error";chip();}).finally(()=>{saving=false;if(dirty){dirty=false;pushShared(false);}});
}
const hhUrl=()=>location.origin+location.pathname+"#h="+HH.code;
function newCode(){const a=new Uint8Array(20);crypto.getRandomValues(a);return Array.from(a,x=>"abcdefghijklmnopqrstuvwxyz0123456789"[x%36]).join("");}
function hhHtml(){
  const cloud=HH&&HH.mode==="cloud"&&HH.code;
  return `<div class="dtop"><div class="in"><button class="back" data-pc>${HH?"Schließen":"Später"}</button></div></div>
  <div class="dbody"><h2>Haushalt</h2>`+(cloud?
  `<p class="note" style="margin-top:0">Alle, die diesen Code haben, sehen denselben Plan, dieselbe Einkaufsliste, denselben Kühlschrank und dieselben eigenen Rezepte, sofort auf allen Handys. ${window.FB?(syncState==="online"?"Verbunden.":syncState==="error"?"Verbindung gestört, die Änderungen werden später gesendet.":"Verbinde …"):"Keine Verbindung zum Server, die App arbeitet lokal weiter."}</p>
   <div class="code">${esc(HH.code)}</div>
   <div class="stack"><button class="btn pri" data-hhshare>Link teilen</button><button class="btn" data-hhcopy>Code kopieren</button><button class="btn warn" id="hhleave">Haushalt verlassen</button></div>
   <p class="note">Tipp: Deine Freundin öffnet den geteilten Link auf ihrem Handy. Dann ist sie automatisch verbunden. Nur wer den Code kennt, kommt an eure Daten. Das Tagebuch bleibt auf dem jeweiligen Handy.</p>`
  :`<p class="note" style="margin-top:0">Verbinde die App mit deiner Freundin oder deinem Haushalt. Dann seht ihr Plan und Einkaufsliste live auf beiden Handys.</p>
   <div class="stack"><button class="btn pri" data-hhnew>Neuen Haushalt anlegen</button></div>
   <h3 class="sec">Ich habe schon einen Code</h3>
   <input id="hh-c" class="finp" placeholder="Code oder Link einfügen" autocapitalize="none" autocomplete="off">
   <div class="stack"><button class="btn" data-hhjoin>Beitreten</button><button class="btn" data-hhlocal>Nur auf diesem Handy nutzen</button></div>`)+`</div>`;
}
function openHh(){pm="H";pnl.innerHTML=hhHtml();pnl.hidden=false;pnl.scrollTop=0;}
function setHH(code){HH={mode:"cloud",code};hsave();startSync();if(!window.FB)toast("Keine Verbindung, Code ist gespeichert");openHh();}

/* ---------- Eingaben ---------- */
function copyTxt(s){try{navigator.clipboard.writeText(s).then(()=>toast("Kopiert"),()=>toast("Bitte lange auf den Code tippen und kopieren"))}catch(e){toast("Bitte lange auf den Code tippen und kopieren")}}
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button"); if(!t) return; const d=t.dataset;
  if(t.id==="bdy"){openDy();return}
  if(t.id==="bhh"){openHh();return}
  if(t.id==="newrec"){openCr("");return}
  if(d.crsave!==undefined){saveCr(d.crsave);return}
  if(d.cred){openCr(d.cred);return}
  if(d.crdel){ if(t.dataset.c){ST.cust=ST.cust.filter(c=>c.id!==d.crdel);delete ST.sel[d.crdel];delete ST.rc[d.crdel];rebuildAll();persist();closeRecipe();toast("Rezept gelöscht")} else {t.dataset.c=1;t.textContent="Wirklich löschen?";setTimeout(()=>{if(t.isConnected){delete t.dataset.c;t.textContent="Löschen"}},3500)} return}
  if(d.dyadd){const r=all[d.dyadd];addEntry({n:r.n,k:r.k,p:r.p,rid:r.id},dkey(new Date()));toast("Heute eingetragen: "+r.n);return}
  if(pm==="Y"&&!pnl.hidden){
    if(d.dyd){const x=new Date(dyk+"T12:00:00");x.setDate(x.getDate()+parseInt(d.dyd));if(dkey(x)<=dkey(new Date())){dyk=dkey(x);drawDy(false);}return}
    if(d.dyr){const r=all[d.dyr];addEntry({n:r.n,k:r.k,p:r.p,rid:r.id});dyq="";drawDy(true);toast("Eingetragen");return}
    if(d.dym){const [i,s]=d.dym.split(":");const e=DY.days[dyk][+i];e.m=Math.max(0.5,e.m+parseFloat(s));dsave();drawDy(true);return}
    if(d.dyx){DY.days[dyk].splice(+d.dyx,1);dsave();drawDy(true);return}
    if(d.dyown!==undefined){const n=$("#dy-n").value.trim(),k=parseFloat($("#dy-k").value.replace(",","."))||0,p=parseFloat($("#dy-p").value.replace(",","."))||0;
      if(!n){toast("Bitte einen Namen eintragen");return} if(k<=0&&p<=0){toast("Bitte kcal eintragen");return}
      addEntry({n,k,p}); if($("#dy-s").checked&&!DY.foods.some(f=>f.n.toLowerCase()===n.toLowerCase())){DY.foods.push({n,k,p});dsave();} drawDy(true);toast("Eingetragen");return}
    if(d.dyf!==undefined){const f=DY.foods[+d.dyf];addEntry({n:f.n,k:f.k,p:f.p});drawDy(true);toast("Eingetragen");return}
    if(d.dyfx!==undefined){DY.foods.splice(+d.dyfx,1);dsave();drawDy(true);return}
  }
  if(pm==="H"&&!pnl.hidden){
    if(d.hhnew!==undefined){setHH(newCode());return}
    if(d.hhjoin!==undefined){const m=$("#hh-c").value.match(/([a-z0-9]{16,64})\s*$/i);if(!m){toast("Das ist kein gültiger Code");return}setHH(m[1].toLowerCase());return}
    if(d.hhlocal!==undefined){HH={mode:"local"};hsave();closePanel();return}
    if(d.hhshare!==undefined){const u=hhUrl();if(navigator.share){navigator.share({title:"Kochplaner",text:"Unser gemeinsamer Kochplaner:",url:u}).catch(()=>{})}else copyTxt(u);return}
    if(d.hhcopy!==undefined){copyTxt(HH.code);return}
    if(t.id==="hhleave"){ if(t.dataset.c){stopSync();HH={mode:"local"};hsave();openHh();toast("Haushalt verlassen")} else {t.dataset.c=1;t.textContent="Wirklich verlassen?";setTimeout(()=>{if(t.isConnected){delete t.dataset.c;t.textContent="Haushalt verlassen"}},3500)} return}
  }
});
document.addEventListener("input",ev=>{
  const id=ev.target.id;
  if(id==="dyq"){dyq=ev.target.value;$("#dyres").innerHTML=dyResHtml();}
  if(id==="dg-k"||id==="dg-p"){const v=parseInt(ev.target.value)||0;if(v>0){if(id==="dg-k")DY.goal.k=v;else DY.goal.p=v;dsave();}}
});
document.addEventListener("change",ev=>{if(ev.target.id==="dg-k"||ev.target.id==="dg-p")drawDy(true);});

/* ---------- Start ---------- */
if(window.FB) startSync(); else window.addEventListener("fb",startSync);
if(!HH) setTimeout(openHh,400);

render();
</script>
