const STEPS={"F1":{"s":["Banane schälen und in grobe Stücke brechen.","300 ml Milch zuerst in den Mixer gießen.","Whey, Banane, Haferflocken, ein paar Eiswürfel und eine Prise Zimt dazugeben.","20 bis 30 Sekunden auf hoher Stufe mixen, bis keine Flocken mehr zu sehen sind.","Kurz probieren und sofort trinken."],"t":"Eiswürfel machen den Shake cremig und weniger „süß-pappig“. Für unterwegs in eine dicht schließende Flasche füllen und innerhalb von 1 bis 2 Stunden trinken."},"F2":{"s":["300 ml Milch zuerst in den Mixer gießen.","Whey Schoko, Erdnussmus, Haferflocken und ein paar Eiswürfel dazugeben.","20 bis 30 Sekunden mixen, bis alles glatt ist.","Kurz probieren und sofort trinken."],"t":"Schmeckt wie ein Snickers-Shake. Erdnussmus setzt sich gern am Boden ab, deshalb vor dem Trinken kurz schwenken."},"F3":{"s":["Wer TK-Beeren nimmt, legt sie 5 bis 10 Minuten vorher zum Antauen in die Schüssel.","250 g Skyr in eine Schüssel geben und glatt rühren.","Beeren und Haferflocken oder Granola darauf verteilen.","Mandeln darübergeben und den Honig darüberträufeln.","Direkt essen, damit Granola und Flocken knusprig bleiben."],"t":"Zarte Haferflocken müssen nicht eingeweicht werden. Wer sie weicher mag, rührt sie unter und lässt die Bowl 5 bis 10 Minuten stehen."},"F4":{"s":["Tomate waschen und in Scheiben schneiden, Schnittlauch in Röllchen schneiden.","3 Eier in eine Schüssel schlagen, mit Salz und Pfeffer verquirlen.","Beschichtete Pfanne bei mittlerer Hitze erwärmen, Eier hineingeben und unter sanftem Rühren stocken lassen. Vom Herd nehmen, solange sie noch leicht glänzen.","Toast rösten und mit körnigem Frischkäse bestreichen.","Tomatenscheiben und Rührei auf den Toast legen, mit Schnittlauch bestreuen."],"t":"Nicht zu heiß braten, sonst wird das Rührei trocken und zäh."},"F5":{"s":["Banane schälen und in Stücke brechen.","Banane, Eier, Haferflocken, Whey und Backpulver in einen hohen Becher geben.","Mit dem Stabmixer zu einem glatten Teig pürieren.","Beschichtete Pfanne bei mittlerer Hitze erwärmen. Kleine Teigportionen hineingeben, damit sie sich leicht wenden lassen.","Je Seite etwa 2 Minuten backen, gewendet wird, wenn die Oberfläche Bläschen wirft und der Rand fest ist.","Mit Zimt oder 50 g Beeren servieren."],"t":"Lieber kleine Pancakes backen, die lassen sich leichter wenden. Die Hitze nicht zu hoch stellen, sonst werden sie außen dunkel und innen roh."},"F6":{"s":["40 g Haferflocken, Skyr, Milch und Chiasamen in ein Glas oder eine Schüssel mit Deckel geben.","Gut verrühren, damit keine trockenen Klumpen bleiben.","Deckel drauf und über Nacht in den Kühlschrank stellen.","Morgens kurz umrühren und die Himbeeren darauf verteilen. TK-Himbeeren tauen bis dahin an.","Direkt aus dem Glas löffeln."],"t":"Das Glas hält sich im Kühlschrank 2 bis 3 Tage, also gern gleich mehrere vorbereiten. Zum Mitnehmen im verschlossenen Glas kühl transportieren."},"F7":{"s":["Gurke waschen und in dünne Scheiben schneiden.","Brezel waagerecht aufschneiden.","Beide Hälften mit Frischkäse light bestreichen.","Putenbrust und Gurkenscheiben auf die untere Hälfte legen, Deckel drauf."],"t":"Zum Mitnehmen in Brotpapier oder eine Dose packen und kühl halten. Besser erst kurz vor dem Essen belegen, sonst weicht die Brezel durch."},"F8":{"s":["Tomate in Scheiben schneiden, Schnittlauch in Röllchen schneiden.","1 TL Öl in einer beschichteten Pfanne bei mittlerer Hitze erwärmen.","Eier aufschlagen, in die Pfanne gleiten lassen und braten, bis das Eiweiß fest ist. Mit Salz und Pfeffer würzen.","Brot toasten und mit körnigem Frischkäse bestreichen.","Tomatenscheiben, Spiegeleier und Schnittlauch darauf anrichten. Wer will, legt Gurkenscheiben dazu."],"t":"Deckel kurz auf die Pfanne setzen, dann stockt das Eiweiß oben schneller, ohne dass das Eigelb hart wird."},"F9":{"s":["Kartoffeln waschen und in etwa 2 cm große Würfel schneiden. Airfryer auf 200 °C vorheizen.","Würfel mit 1 TL Öl, Paprikapulver und Salz mischen.","Kartoffeln in einer Lage in den Korb geben, ohne ihn zu überfüllen. 18 bis 20 Minuten garen, zwischendurch einmal wenden oder schütteln.","Quark mit Schnittlauch, Salz und Pfeffer verrühren.","In den letzten Minuten 1 TL Öl in der Pfanne erhitzen und die Eier zu Spiegeleiern braten.","Garprobe: Die Kartoffeln sind fertig, wenn sie außen knusprig sind und sich innen mit einer Gabel leicht einstechen lassen.","Kartoffeln mit Spiegeleiern und Kräuterquark anrichten."],"t":"Gleich große Würfel garen gleichmäßig. Übrige Kartoffeln halten sich im Kühlschrank 2 bis 3 Tage."},"M1":{"s":["Reis nach Packungsanleitung kochen.","Hähnchen in gleich große Würfel schneiden, Brokkoli in kleine Röschen teilen. Airfryer auf 180 °C vorheizen.","Hähnchen mit Öl, Sojasauce, Paprika und Knoblauchpulver mischen.","Hähnchen in den Korb geben, ohne ihn zu überfüllen, und 10 bis 12 Minuten garen. Zwischendurch einmal schütteln.","Brokkoli die letzten 6 Minuten dazugeben.","Garprobe: Das Hähnchen ist innen nicht mehr rosa, Kerntemperatur 75 °C.","Reis in eine Schale geben, Hähnchen und Brokkoli darauf anrichten."],"t":"Hält sich im Kühlschrank 3 Tage, gut für Mealprep. Zum Aufwärmen etwas Wasser über den Reis geben."},"M2":{"s":["Hähnchen in Streifen schneiden und mit Paprika und Salz würzen. Airfryer auf 180 °C vorheizen.","Hähnchenstreifen in den Korb geben, nicht überfüllen, und 8 bis 10 Minuten garen. Zwischendurch einmal schütteln, Kerntemperatur 75 °C.","Skyr mit Salz, Knoblauch und einem Spritzer Zitrone zum Dip verrühren.","Salat waschen, Tomate und Gurke in Scheiben oder Streifen schneiden.","Wraps mit Dip bestreichen, Salat, Gemüse, Hähnchen und Käse darauflegen, einrollen.","Wer mag, gart die Wraps zum Schluss 3 Minuten im Airfryer, bis der Käse geschmolzen ist."],"t":"Mit der Naht nach unten in den Airfryer legen, dann bleibt der Wrap zu. Zum Mitnehmen in Folie wickeln, den Dip separat transportieren."},"M3":{"s":["Kartoffeln waschen, in Würfel schneiden und mit Öl und Salz mischen. Airfryer auf 190 °C vorheizen.","Kartoffeln in den Korb geben und 20 Minuten garen, zwischendurch einmal schütteln.","Hähnchen mehrmals einschneiden und mit Salz, Pfeffer und Oregano würzen.","Ab Minute 8 das Hähnchen mit in den Korb legen, 190 °C bleiben. Etwa 15 Minuten garen, einmal wenden, Kerntemperatur mindestens 75 °C.","Tomaten und Mozzarella in Scheiben schneiden.","Pesto auf das Hähnchen streichen, Tomaten und Mozzarella darauflegen und die letzten 3 Minuten überbacken, bis der Käse schmilzt.","Hähnchen mit den Kartoffeln anrichten."],"t":"Wenn der Korb zu klein ist, Hähnchen und Kartoffeln locker nebeneinander legen und nicht stapeln."},"M4":{"s":["Reis nach Packungsanleitung kochen.","Zwiebel in kleine Würfel schneiden, Paprika entkernen und würfeln.","Öl in einer großen Pfanne erhitzen, Zwiebel kurz andünsten, dann das Hack dazugeben und krümelig anbraten, bis es durchgegart und nicht mehr rosa ist.","Paprika dazugeben und kurz mitbraten.","Tomatensoße, Paprikapulver, Salz und Pfeffer unterrühren und 5 Minuten köcheln lassen.","Den Reis untermischen, Käse darüberstreuen und kurz schmelzen lassen."],"t":"Hält sich im Kühlschrank 3 Tage und lässt sich gut vorkochen. Zum Aufwärmen einen Schluck Wasser dazugeben."},"M5":{"s":["Nudeln in Salzwasser nach Packungsanleitung kochen.","Hähnchen in Würfel schneiden, Knoblauch fein hacken.","Hähnchen mit Knoblauch in Öl in der Pfanne rundherum anbraten oder 10 Minuten im auf 180 °C vorgeheizten Airfryer garen, einmal schütteln. Kerntemperatur 75 °C.","Tomatensoße zum Hähnchen geben und 5 Minuten köcheln lassen.","Nudeln abgießen und mit der Sauce mischen.","Parmesan und Basilikum darüber, servieren."],"t":"Etwas Nudelwasser macht die Sauce schön cremig. Hält sich im Kühlschrank 2 bis 3 Tage."},"M6":{"s":["Süßkartoffel waschen und in Würfel schneiden. Airfryer auf 190 °C vorheizen.","Würfel mit Öl und Salz mischen, in den Korb geben, ohne ihn zu überfüllen, und 18 Minuten garen. Zwischendurch einmal schütteln.","Hähnchen in Würfel schneiden und mit Paprikagewürz würzen.","Ab Minute 8 das Hähnchen zu den Süßkartoffeln in den Korb geben. Kerntemperatur 75 °C.","Salat waschen, Avocado in Scheiben schneiden.","Skyr mit einer Prise Salz glattrühren.","Salat in eine Schüssel geben, Süßkartoffeln, Hähnchen und Avocado darauf anrichten, Skyr-Dip dazugeben."],"t":"Für Mealprep Süßkartoffeln, Hähnchen und Dip getrennt aufbewahren (3 Tage). Avocado erst kurz vor dem Essen schneiden, sonst wird sie braun."},"M7":{"s":["Reis nach Packungsanleitung kochen.","Zwiebel würfeln, Paprika entkernen und würfeln, Knoblauch fein hacken.","Zwiebel und Hack in einer großen Pfanne scharf anbraten, bis das Hack krümelig und nicht mehr rosa ist.","Paprika, Knoblauch, Chili, Kreuzkümmel, Paprikapulver und Salz dazugeben und kurz mitbraten.","Kidneybohnen abspülen und abtropfen lassen, dann mit der Tomatensoße in die Pfanne geben und 10 Minuten köcheln lassen. Zwischendurch umrühren.","Chili auf dem Reis anrichten und mit einem Löffel Skyr servieren."],"t":"Schmeckt am nächsten Tag noch besser und hält sich im Kühlschrank 3 Tage. Chili vorsichtig dosieren und nachwürzen."},"M8":{"s":["Mozzarella in Scheiben schneiden oder zupfen, Tomaten in Scheiben schneiden. Airfryer auf 180 °C vorheizen.","Je einen Wrap (muss in den Korb passen, ggf. zuschneiden) 2 Minuten vorbacken.","Skyr mit Knoblauch und Salz zum Dip verrühren.","Wrap mit Tomatensoße bestreichen, Mozzarella und Tomatenscheiben darauflegen.","Bei 190 °C 4 bis 5 Minuten backen, bis der Käse geschmolzen ist. Den zweiten Wrap genauso machen, falls beide nicht gleichzeitig hineinpassen.","Mit Basilikum und Oregano bestreuen, Dip dazu servieren."],"t":"Den Rand im Auge behalten, er wird schnell dunkel. Optional 4 Scheiben Putenbrust darauflegen (+60 kcal, +12 g Eiweiß)."},"A1":{"s":["Airfryer auf 190 °C vorheizen (ca. 3 Minuten). Kartoffeln waschen und in Spalten schneiden, Paprika und Zucchini in mundgerechte Stücke schneiden.","Kartoffelspalten mit 2 TL Öl und Salz mischen und locker im Korb verteilen, 20 Minuten bei 190 °C garen. Nach 8 Minuten wenden oder den Korb kräftig schütteln.","Holzspieße kurz in Wasser legen, damit sie nicht verbrennen. Hähnchen in gleichmäßige Würfel schneiden und abwechselnd mit Paprika und Zucchini auf die Spieße stecken.","Spieße mit Salz, Pfeffer und Paprikapulver würzen und ab Minute 8 zu den Kartoffeln in den Korb legen (190 °C bleibt, nicht stapeln). Falls nötig, in zwei Runden garen.","Quark mit Kräutern und einer Prise Salz glatt rühren.","Garprobe: Das Hähnchen ist durch, wenn es innen nicht mehr rosa ist (Kerntemperatur 75 °C) und die Kartoffeln außen goldbraun sind. Mit dem Kräuterquark servieren."],"t":"Wenn die Spieße zu lang für den Korb sind, einfach kürzen oder schräg legen. Kartoffeln nicht überfüllen, sonst werden sie weich statt knusprig."},"A2":{"s":["Tomaten in Scheiben, Mozzarella in dünne Scheiben schneiden. Basilikum zupfen.","3 Eier in eine Schüssel schlagen, mit Salz und Pfeffer verquirlen.","1 TL Öl in einer Pfanne bei mittlerer Hitze erhitzen, Eier hineingießen und stocken lassen, bis die Unterseite fest ist, die Oberseite aber noch leicht glänzt.","Tomaten und Mozzarella auf eine Hälfte legen, die andere Hälfte darüberklappen und 2 Minuten ziehen lassen, damit der Käse leicht schmilzt.","Basilikum darauf geben und mit den 3 Scheiben Brot servieren."],"t":"Nicht zu heiß braten, sonst wird das Omelett außen braun und innen noch flüssig. Tomaten kurz auf Küchenpapier abtupfen, dann wird das Omelett nicht wässrig."},"A3":{"s":["Nudeln nach Packungsbeilage in Salzwasser kochen, abgießen. Airfryer auf 180 °C vorheizen.","Hähnchenbrust zwischen Frischhaltefolie flach klopfen (gleichmäßig ca. 1,5 cm dick), damit sie gleichmäßig gar wird. Mit Salz und Pfeffer würzen.","Dünn mit Öl einstreichen und in den Semmelbröseln wenden, die Brösel fest andrücken.","Im Airfryer bei 180 °C 12 Minuten garen, nach der Hälfte der Zeit einmal wenden.","Tomatensoße mit Oregano auf dem Hähnchen verteilen, Mozzarella darauf legen und bei 180 °C 4 bis 5 Minuten überbacken, bis der Käse geschmolzen ist. Garprobe: Kerntemperatur 75 °C, innen nicht mehr rosa.","Mit den Nudeln und Salat anrichten."],"t":"Beim Klopfen die Folie nutzen, damit nichts spritzt. Dicke Stücke brauchen eher die längere Garzeit."},"A4":{"s":["Reis nach Packungsbeilage in Salzwasser kochen. Währenddessen Hähnchen in mundgerechte Würfel schneiden und Paprika, Zucchini und Brokkoli klein schneiden.","Eine Pfanne mit wenig Wasser oder Öl erhitzen, Hähnchenwürfel mit Salz 3 bis 4 Minuten anbraten.","Currypaste dazugeben und 1 Minute mitbraten, bis es duftet.","Gemüse zugeben, kurz mitbraten, dann Kokosmilch und einen Schuss Wasser angießen.","Bei mittlerer Hitze 10 Minuten köcheln lassen, bis das Gemüse bissfest ist. Hähnchen ist gar, wenn es innen nicht mehr rosa ist. Mit Salz und Pfeffer abschmecken.","Auf dem Reis anrichten."],"t":"Sauce zu dick? Einen Schluck Wasser nachgießen. Hält sich 2 bis 3 Tage im Kühlschrank, gut zum Vorkochen."},"A5":{"s":["Paprika und Tomaten würfeln, Knoblauch fein hacken.","1 TL Öl in einer Pfanne erhitzen, Paprika und Knoblauch 2 bis 3 Minuten anbraten.","Tomaten, Kreuzkümmel, Paprikapulver und Salz zugeben und 8 Minuten köcheln lassen, bis die Sauce etwas eindickt.","Mit einem Löffel drei Mulden in die Sauce drücken und die Eier hineinschlagen.","Deckel auflegen und 5 Minuten bei niedriger Hitze stocken lassen, bis das Eiweiß fest ist.","Feta darüber bröseln und mit dem Brot servieren."],"t":"Wer das Eigelb fester mag, lässt es 1 bis 2 Minuten länger stocken. Die Pfanne nicht zu heiß stellen, sonst brennt die Sauce an."},"S1":{"s":["Skyr in eine Schüssel geben.","Beeren darauf geben (TK-Beeren vorher 10 bis 15 Minuten antauen lassen).","Mandeln darüberstreuen und gleich essen."],"t":"Zum Mitnehmen in eine verschlossene Box füllen und kühl lagern, am besten am selben Tag essen."},"S2":{"s":["Skyr in eine Schüssel geben, Kakao und Honig (oder Süßstoff) dazugeben.","Mit einem Löffel glatt rühren, bis keine Kakaoklümpchen mehr zu sehen sind.","Banane in Scheiben schneiden, auf die Creme legen und probieren."],"t":"Mit mehr Kakao wird die Creme dunkler und bitterer. Bananenscheiben erst kurz vor dem Essen darauflegen, sonst werden sie braun."},"S3":{"s":["Gurke waschen und in Stifte schneiden.","Putenscheiben einzeln auslegen und dünn mit Frischkäse bestreichen.","Je ein paar Gurkenstifte an das Ende legen und die Pute straff aufrollen.","Röllchen mit den Reiswaffeln anrichten."],"t":"Für unterwegs in eine Box legen und kühl halten, im Kühlschrank bis zu 1 Tag haltbar. Reiswaffeln separat einpacken, damit sie knusprig bleiben."},"S4":{"s":["Tomaten waschen und in Scheiben oder kleine Würfel schneiden.","Brot im Toaster oder in der Pfanne rösten.","Körnigen Frischkäse auf das Brot geben, Tomaten darauf legen.","Mit Olivenöl, Salz, Pfeffer und Basilikum würzen."],"t":"Brot erst kurz vor dem Essen belegen, damit es knusprig bleibt."},"S5":{"s":["Quark in eine Schüssel geben, Kakao und Süßstoff oder Honig dazugeben.","Mit einem Schneebesen oder Löffel 1 Minute cremig rühren, bis eine gleichmäßige Masse entsteht.","Probieren und bei Bedarf nachsüßen.","Himbeeren (TK vorher antauen) darauf verteilen."],"t":"Mit dem Schneebesen wird die Mousse luftiger. Am besten vorbereitet 30 Minuten kühl stellen."},"S6":{"s":["Mozzarella abtropfen lassen, Mozzarella und Tomaten in Scheiben schneiden.","Abwechselnd auf einem Teller schichten.","Mit Olivenöl, Salz und Basilikum würzen.","Putenscheiben daneben legen und gleich essen."],"t":"Tomaten kurz vor dem Anrichten salzen, sonst ziehen sie Wasser."},"S7":{"s":["300 ml Wasser in einen Shaker oder ein Glas geben.","Whey dazugeben und 20 bis 30 Sekunden kräftig schütteln oder mixen, bis keine Klümpchen mehr da sind.","Apfel waschen und dazu essen, am besten in Spalten geschnitten.","Gleich trinken, langsam in kleinen Schlucken."],"t":"Für Tage mit wenig Zeit. Zu Hause besser Variante S1 bis S6."},"S8":{"s":["Milch in den Shaker oder Mixer geben.","Whey und Eiswürfel dazugeben, optional etwas Zimt.","20 bis 30 Sekunden kräftig mixen oder schütteln, bis alles glatt ist.","Kalt und langsam trinken."],"t":"Eiswürfel kurz mitmixen, dann wird der Shake schön kalt. Bei Übelkeit in kleinen Schlucken trinken."},"S9":{"s":["Skyr in eine Box geben und glatt rühren.","Haferflocken darauf geben. Zarte Flocken müssen nicht eingeweicht werden. Wer sie weicher mag, rührt sie unter und lässt sie 5 bis 10 Minuten quellen oder die Box über Nacht im Kühlschrank stehen.","Beeren darauf verteilen (TK-Beeren am Vorabend einpacken, dann tauen sie bis zum Mittag an).","Mit Honig beträufeln, Deckel schließen und kühl transportieren.","Vor dem Essen kurz umrühren und probieren."],"t":"Wer die Haferflocken knusprig mag, packt sie getrennt ein und gibt sie erst vor dem Essen dazu."},"S10":{"s":["Maiswaffeln auf einen Teller legen.","Körnigen Frischkäse gleichmäßig auf die Waffeln löffeln.","Mit Honig beträufeln und gleich essen."],"t":"Erst kurz vor dem Essen belegen, sonst werden die Waffeln weich. Zum Mitnehmen Waffeln und Frischkäse getrennt transportieren."},"S11":{"s":["Schnittlauch waschen und in Röllchen schneiden.","Körnigen Frischkäse auf die Maiswaffeln löffeln.","Hähnchenaufschnitt darauf legen.","Mit Salz, Pfeffer und Schnittlauch würzen und gleich essen."],"t":"Zum Mitnehmen Waffeln getrennt einpacken und erst vor dem Essen belegen. Aufschnitt kühl lagern."},"S12":{"s":["Mozzarella abtropfen lassen, Mozzarella und Tomaten in Scheiben schneiden.","Abwechselnd auf einem Teller anrichten.","Mit Balsamico und Olivenöl beträufeln.","Mit Salz, Pfeffer und Basilikum würzen und probieren."],"t":"Tomaten kurz vor dem Servieren salzen, damit sie nicht zu viel Wasser ziehen."},"S13":{"s":["Becher aus dem Kühlschrank nehmen und Mindesthaltbarkeit prüfen.","Deckel abziehen, gut umrühren.","Direkt aus dem Becher essen."],"t":null},"S14":{"s":["Becher aus dem Kühlschrank nehmen und Mindesthaltbarkeit prüfen.","Decke /* ---------- Einkaufsliste ---------- */
function shopList(use){
 const items={},need={},vor=new Set();
 for(const id in use){const r=all[id],f=(r.ns?1:2*(r.w||1))*use[id];
  r.z.forEach(zs=>zs.split(/,\s+(?=[\d½])/).forEach(p=>{p=p.trim().replace(/^[A-Za-zÄÖÜäöüß\- ]+:\s*/,"");
   const m=p.match(/^(½|\d+(?:[.,]\d+)?)\s*(?:(g|ml|EL|TL|Scheiben|Scheibe|Scoop|Tasse)\s+)?(.+)$/);
   if(!m){if(/ketchup/i.test(p))vor.add("Ketchup");if(SPICE.test(p.toLowerCase()))return;const c=classify(p);
    if(c){if(c.c===VO)vor.add(c.l);else need[c.c+"|"+c.l]=1;}else if(p.length<=30)vor.add(p);return;}
   let q=m[1]==="½"?0.5:parseFloat(m[1].replace(",","."));let u=m[2]||"Stk";const rest=m[3].split(",")[0];let c=classify(rest);
   if(!c){if(!r.cust&&r.id[0]!=='P')return;if(SPICE.test(rest.toLowerCase()))return;c={c:TR,l:rest.trim()};}
   if(c.c===VO){vor.add(c.l);return;}
   if(u==="EL"||u==="TL"||u==="Tasse"){if(c.l!=="Skyr"&&c.l!=="Magerquark")vor.add(c.l);return;}
   if(u==="Scoop"){q*=30;u="g";}
   if(u==="Scheibe"||u==="Scheiben"){if(c.l==="Putenaufschnitt"){q*=15;u="g";}else u="Scheiben";}
   if(c.l==="Tomaten"&&u==="Stk"){q*=120;u="g";}
   if(c.l==="Paprika"&&u==="g"){q/=150;u="Stk";}
   if(c.l==="Gurken"&&u==="g"){q/=300;u="Stk";}
   if(c.l==="Zwiebeln"&&u==="g"){q/=100;u="Stk";}
   const key=c.c+"|"+c.l+"|"+u;items[key]=(items[key]||0)+q*f;}));}
 const out={};CATS.forEach(c=>out[c]=[]);const have=new Set();
 Object.keys(items).sort().forEach(k=>{const[c,l,u]=k.split("|");have.add(c+"|"+l);let q,sub="";
   if(PACK[l]&&u==="g"){const np=Math.ceil(items[k]/PACK[l]-0.001);q=np+(np===1?" Packung":" Packungen")+" à "+PACK[l]+" g";sub="gebraucht ca. "+fmt(items[k],u);}
   else q=fmt(items[k],u);
   out[c].push({key:k,l,q,sub});});
 Object.keys(need).forEach(k=>{if(!have.has(k)&&!(k.endsWith("|Salat")&&need[G+"|Salat / Tomate / Gurke"])){const[c,l]=k.split("|");out[c].push({key:k,l,q:"nach Bedarf",sub:""});}});
 return {out,vor:[...vor].sort()};
}

/* ---------- Bildschirm anlassen ---------- */
let lock=null,nsv=null,awake=false;
async function keepAwake(){
  let ok=false;
  try{ if(navigator.wakeLock){lock=await navigator.wakeLock.request("screen");ok=true;lock.addEventListener("release",()=>{lock=null});} }catch(e){}
  if(!ok){try{ if(!nsv){nsv=document.createElement("video");nsv.setAttribute("playsinline","");nsv.setAttribute("muted","");nsv.muted=true;nsv.loop=true;nsv.src=NSVIDEO;nsv.style.cssText="position:fixed;left:0;top:0;width:2px;height:2px;opacity:.02;pointer-events:none";document.body.appendChild(nsv);} await nsv.play();ok=true;}catch(e){}}
  awake=ok; const w=$("#wk"); if(w){w.textContent=ok?"Bildschirm bleibt an":"Bildschirm kann ausgehen";w.classList.toggle("on",ok);}
}
function letSleep(){ if(lock){try{lock.release()}catch(e){}lock=null} if(nsv){try{nsv.pause()}catch(e){}} awake=false; }
document.addEventListener("visibilitychange",()=>{ if(openId&&document.visibilityState==="visible") keepAwake(); });

const metaOf=r=>`${r.k} kcal · ${r.p} g Eiweiß · ${r.t}${(ST.rate&&ST.rate[r.id])?" · "+"★".repeat(ST.rate[r.id]):""}`;

function listHtml(){
  const q=fq.trim().toLowerCase();
  const rows=ALL.filter(r=>(fg==="Alle"||grp(r)===fg)&&(!q||(r.n+" "+r.id).toLowerCase().includes(q)));
  if(!rows.length) return '<p class="empty">Kein Rezept gefunden.</p>';
  return rows.map(r=>{const n=ST.sel[r.id]||0;
    return `<div class="rc"><button class="rb" data-open="${r.id}"><span class="top"><span class="id">${r.id}</span><b>${esc(r.n)}</b></span><span class="meta">${metaOf(r)}</span></button><button class="add" data-add="${r.id}" aria-pressed="${n>0}" aria-label="${n>0?"Aus Plan nehmen":"Zum Plan hinzufügen"}">${n>0?(n>1?n+"×":"✓"):"+"}</button></div>`}).join("");
}
function recipesHtml(){
  return `<div class="tools"><input id="q" type="search" placeholder="Rezept suchen" value="${esc(fq)}" aria-label="Rezept suchen"><div class="chips" id="chips">${GROUPS.map(g=>`<button data-g="${g}" aria-pressed="${g===fg}">${g}</button>`).join("")}</div></div><div id="list">${listHtml()}</div>`;
}
function planHtml(){
  const ids=Object.keys(ST.sel);
  if(!ids.length) return '<p class="empty">Noch nichts im Plan. Tippe bei den Rezepten auf das Plus, zum Beispiel für zwei Gerichte über zwei Tage. Daraus entsteht deine Einkaufsliste.</p>';
  const n=ids.reduce((a,i)=>a+ST.sel[i],0);
  return `<div class="sum"><b>${n}× kochen</b> aus ${ids.length} Rezept${ids.length>1?"en":""}. Mengen gelten für 2 Personen. Weiter zum <b>Einkauf</b> für die Liste.</div>`+
   ids.map(id=>{const r=all[id];return `<div class="prow"><div class="nm"><span class="id">${r.id}</span> <b>${esc(r.n)}</b><span class="meta">${metaOf(r)}</span></div>

    <div class="acts"><button class="btn pri" data-open="${id}">Kochen</button></div></div>`}).join("")+
   `<button class="btn warn" id="clr" style="width:100%;margin-top:6px">Plan leeren</button>`;
}
function shopHtml(){
  if(!nSel()) return '<p class="empty">Die Einkaufsliste erscheint, sobald Rezepte im Plan sind.</p>';
  const L=shopList(ST.sel); let total=0,done=0;
  const secs=CATS.map(c=>{const it=L.out[c]; if(!it.length) return ""; it.forEach(x=>{total++;if(ST.sc[x.key])done++});

  const vor=L.vor.length?`<h3 class="sec">Zuhause prüfen</h3><div class="vor">${L.vor.map(v=>`<button data-sc="V|${esc(v)}" aria-pressed="${!!ST.sc["V|"+v]}">${esc(v)}</button>`).join("")}</div>`:"";
  return `<div class="cnt">${done} von ${total} abgehakt</div>${secs}${vor}
   <p class="note">Packungsgrößen: Hack und Hähnchen in 400 g, Skyr und Quark in 500 g. Dazu kommen Basis-Gewürze (Salz, Pfeffer, Paprika-, Knoblauch-, Zwiebelpulver, Oregano).</p>
   <button class="btn" id="rst" style="width:100%">Haken zurücksetzen</button>`;
}
function badges(){
  $("#bp").textContent=nSel()||"";
  let open="";
  if(nSel()){const L=shopList(ST.sel);let t=0,d=0;CATS.forEach(c=>L.out[c].forEach(x=>{t++;if(ST.sc[x.key])d++}));open=t-d>0?t-d:"";}

}
function render(){
  document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));

function detailHtml(id){
  const r=all[id], rc=ST.rc[id]||{z:{},s:{}}, f=r.ns?1:2*(r.w||1), n=ST.sel[id]||0;
  return `<div class="dtop"><div class="in"><button class="back" id="back">Zurück</button><span class="wk" id="wk">Bildschirm wird geprüft</span></div></div>
  <div class="dbody"><h2>${esc(r.n)}</h2>
   <div class="tags"><span class="tag">${r.id}</span><span class="tag">${r.k} kcal${r.u&&/pro /.test(r.u)?"":" pro Person"}</span><span class="tag">${r.p} g Eiweiß${r.u&&/pro /.test(r.u)?"":" pro Person"}</span><span class="tag">${esc(r.t)}</span></div>
   ${r.u?`<div class="meta" style="margin-bottom:4px">${esc(r.u)}</div>`:""}
   <h3 class="sec">Zutaten (${r.ns?esc(r.pt):"für 2 Personen"})</h3>

const LCAT={}, _lab={};
function labelsOf(id){
  if(_lab[id]) return _lab[id];
  const r=all[id], set=new Set();
  r.z.forEach(zs=>zs.split(/,\s+(?=[\d½])/).forEach(p=>{
    p=p.trim().replace(/^[A-Za-zÄÖÜäöüß\- ]+:\s*/,"");
    const m=p.match(/^(½|\d+(?:[.,]\d+)?)\s*(?:(g|ml|EL|TL|Scheiben|Scheibe|Scoop|Tasse)\s+)?(.+)$/);
    if(m&&(m[2]==="EL"||m[2]==="TL"||m[2]==="Tasse")) return;
    if(!m&&SPICE.test(p.toLowerCase())) return;
    const c=classify(m?m[3].split(",")[0]:p);
    if(c&&c.c!==VO){set.add(c.l);LCAT[c.l]=c.c;}else if(!c&&(r.cust||r.id[0]==='P')){const nm=(m?m[3]:p).split(',')[0].trim();if(nm){set.add(nm);LCAT[nm]=TR;}}
  }));
  return _lab[id]=[...set];
}

const SH=["sel","sc","fr","cust","done","offers","week","rate","aoffers","plz","stores","wish","extra"];
const DFLT=k=>k==="plz"?"":(k==="cust"||k==="offers"||k==="stores"||k==="wish"||k==="extra"?[]:{});
let fbRef=null,unsub=null,last={},syncState="off",ready=false;
const SYK="kochplaner.sync.v1";

function chip(){const b=$("#bhh");if(!b)return;b.classList.toggle("sync",syncState==="online");b.classList.toggle("err",syncState==="error");}
function stopSync(){if(unsub){unsub();unsub=null}fbRef=null;last={};ready=false;syncState="off";chip();}
function startSync(){
  if(!window.FB||!HH||HH.mode!=="cloud"||!HH.code) return; stopSync();
  try{last=JSON.parse(localStorage.getItem(SYK)||"{}")||{};}catch(e){last={};}
  fbRef=FB.doc(FB.db,"households",HH.code);
  unsub=FB.onSnapshot(fbRef,snap=>{
    if(snap.metadata.hasPendingWrites) return;
    syncState=snap.metadata.fromCache?"off":"online"; chip();
    if(!snap.exists()){if(!snap.metadata.fromCache){
      if(joinMode){joinMode=false;HH={mode:"local"};hsave();stopSync();toast("Diesen Haushalt gibt es nicht. Bitte den Code prüfen.");if(pm==="H"&&!pnl.hidden)openHh();return}
      ready=true;pushShared(true);}return}
    joinMode=false;
    applyRemote(snap.data());
    if(!snap.metadata.fromCache){ready=true;pushShared(false);}
  },()=>{syncState="error";chip();});
}
function applyRemote(d){
  let ch=false,cust=false;
  SH.forEach(k=>{const s=d[k+"S"]; if(typeof s!=="string"||s===last[k]) return;
    const loc=JSON.stringify(ST[k]||DFLT(k));
    if(k!=="aoffers"&&last[k]!==undefined&&loc!==last[k]) return; /* eigene, noch nicht gesendete Änderung bleibt erhalten */
    last[k]=s;try{ST[k]=JSON.parse(s);ch=true;if(k==="cust")cust=true;}catch(e){}});
  saveLast();
  if(!ch) return;
  try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}
  if(cust) rebuildAll();
  const a=document.activeElement; if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")) return;
  if(openId) redrawDetail(); else if(pnl.hidden) render(); else if(pm==="F") refreshFridge();
}
flush=function(){pushShared(false);};
function pushShared(force){
  if(!fbRef||!ready) return;
  if(saving){dirty=true;return}
  const o={},sent=[],prev={};
  SH.forEach(k=>{if(k==="aoffers")return;const s=JSON.stringify(ST[k]||DFLT(k)); if(force||s!==last[k]){o[k+"S"]=s;sent.push(k);prev[k]=last[k];last[k]=s;}});
  try{const sl=JSON.stringify(shopLabels());if(force||sl!==last.shopS){o.shopS=sl;sent.push("shopS");prev.shopS=last.shopS;last.shopS=sl;}}catch(e){}
  if(!sent.length) return;
  o.u=Date.now(); saving=true;
  FB.setDoc(fbRef,o,{merge:true}).then(saveLast).catch(()=>{sent.forEach(k=>{last[k]=prev[k]});syncState="error";chip();}).finally(()=>{saving=false;if(dirty){dirty=false;pushShared(false);}});
}

/* ===== Zusatz 3: Schnell eintragen (Text -> kcal und Eiweiß) ===== */
const NUMW={ein:1,eine:1,einen:1,einem:1,zwei:2,drei:3,vier:4,fuenf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,halb:0.5,halbe:0.5,halben:0.5,halbes:0.5,halber:0.5};
const GUNIT={g:1,gr:1,gramm:1,kg:1000,ml:1,l:1000,liter:1000,el:12,tl:4};
const nm=s=>String(s).replace(/½/g," 0.5 ").toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/[^a-z0-9%. ]/g," ").replace(/\.(?!\d)/g," ").replace(/(^|\D)\./g,"$1 ").replace(/\s+/g," ").trim();
FOODDB.forEach(f=>{f._a=[nm(f.n)].concat(f.a.map(nm));f._u=f.u.map(x=>[nm(x[0]),x[1],x[0]]);});
const stripPl=w=>w.replace(/(en|n|e|s)$/,"");
function scoreFood(f,q){
  let best=0; const qt=q.split(" ");
  for(const al of f._a){
    let s=0;
    if(q===al) s=100+al.length;
    else if((" "+q+" ").includes(" "+al+" ")) s=60+al.length;
    else if(al.length>=3&&q.length>=3&&al.includes(q)) s=40+10*q.length/al.length;
    else{const at=al.split(" ");const hit=qt.filter(w=>w.length>=3&&at.some(x=>x===w||stripPl(x)===stripPl(w))).length;if(hit)s=20*hit/qt.length+hit;}
    if(s>best) best=s;
  }
  return best;
}
function findFoods(q){
  if(!q) return [];
  return FOODDB.map(f=>({f,s:scoreFood(f,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,4).map(x=>x.f);
}
function parsePiece(raw){
  let t=nm(raw.replace(/(\d)([a-zA-Zäöüß])/g,"$1 $2").replace(/(\d),(\d)/g,"$1.$2")); if(!t) return null;
  let tok=t.split(" "), n=1, hasN=false;
  if(/^\d+(\.\d+)?$/.test(tok[0])){n=parseFloat(tok[0]);tok.shift();hasN=true;}
  else if(NUMW[tok[0]]!==undefined){n=NUMW[tok[0]];tok.shift();hasN=true;}
  let unit="";
  if(tok.length>1&&(GUNIT[tok[0]]!==undefined)){unit=tok.shift();}
  else if(tok.length>1&&/^(tasse|tassen|glas|glaeser|flasche|flaschen|dose|dosen|stueck|stk|scheibe|scheiben|portion|portionen|becher|kugel|kugeln|riegel|schale|teller|handvoll)$/.test(tok[0])){unit=tok.shift();}
  if(tok[0]==="x"||tok[0]==="von") tok.shift();
  const q=tok.join(" ");
  return {raw:raw.trim(),q,n,hasN,unit,foods:findFoods(q),fi:0};
}
function calcPiece(pc){
  const f=pc.foods[pc.fi]; if(!f) return null;
  let g, label;
  const fmtq=x=>String(Math.round(x*10)/10).replace(".",",");
  if(pc.unit&&GUNIT[pc.unit]!==undefined&&!["el","tl"].includes(pc.unit)){g=pc.n*GUNIT[pc.unit];label=fmtq(pc.n)+" "+pc.unit;}
  else if(pc.unit==="el"||pc.unit==="tl"){g=pc.n*GUNIT[pc.unit];label=fmtq(pc.n)+" "+pc.unit.toUpperCase();}
  else if(!pc.unit&&pc.hasN&&pc.n>=20){g=pc.n;label=fmtq(g)+" g";}
  else{
    let u=null; if(pc.unit){u=f._u.find(x=>x[0]===pc.unit||stripPl(x[0])===stripPl(pc.unit));}
    if(!u) u=f._u.find(x=>x[2]!=="g"&&x[2]!=="ml")||f._u[0];
    if(u[2]==="g"||u[2]==="ml"){g=pc.n*(pc.hasN?1:100);label=fmtq(g)+" "+u[2];}
    else{g=pc.n*u[1];label=fmtq(pc.n)+" "+u[2];}
  }
  return {f,g,label,k:f.k*g/100,p:f.p*g/100};
}
let QP=[];
function qParse(text){
  QP=text.replace(/(\d),(\d)/g,"$1§$2").split(/\s*(?:,|\+|&|\bund\b|\bplus\b|\bmit\b)\s*/i).map(p=>parsePiece(p.replace(/§/g,","))).filter(Boolean);
}
function qHtml(){
  if(!QP.length) return "";

    const c=calcPiece(pc);
    if(!c) return `<div class="ent" style="grid-template-columns:1fr"><b>${esc(pc.raw)}</b><span class="meta">Nicht gefunden. Trag Kalorien und Eiweiß unten selbst ein oder scanne den Barcode.</span></div>`;

  }).join("");
  return `<div class="box" style="margin-top:6px">${rows}</div>`+(ok?`<button class="btn pri" data-qadd style="width:100%;margin-top:8px">Eintragen: ${Math.round(tk)} kcal · ${f1(tp)} g Eiweiß</button>`:"");
}

/* ===== Zusatz 9: Eigenes Rezept, kcal, Eiweiß und Zeit ungefähr automatisch berechnen ===== */
const SKIPZ=/salz|pfeffer|gewuerz|gewürz|wasser|paprikapulver|oregano|chili|kraeuter|kräuter|knoblauchpulver|zwiebelpulver|kreuzkuemmel|kreuzkümmel|zimt|muskat|petersilie|schnittlauch|dill|basilikum/i;
function estimateRecipe(zLines,sLines){
  let k=0,p=0,found=0; const unknown=[];
  zLines.forEach(line=>String(line).split(/\s*,\s+(?=[\d½])/).forEach(part=>{
    if(!part.trim()) return;
    const pc=parsePiece(part);
    if(!pc||!pc.foods.length){ if(!SKIPZ.test(part)) unknown.push(part.trim()); return; }
    pc.fi=0; const c=calcPiece(pc); if(!c){ unknown.push(part.trim()); return; }
    let f=1,fp=1; const t=nm(part), fn=c.f.n.toLowerCase();
    if(!/gekocht|gegart|gebraten|fertig/.test(t)){
      if(/(reis|nudel|pasta|couscous|spaghetti|linsen|bulgur|kidney|kichererbsen)/.test(fn)&&/gekocht/.test(fn)){f=fp=2.7;}
      else if(/(gegart|gebraten)/.test(fn)){f=0.7;fp=0.75;}
    }
    k+=c.k*f; p+=c.p*fp; found++;
  }));
  let mins=0, any=false;
  sLines.forEach(s=>{const m=String(s).match(/(\d+)\s*(?:–|-)\s*(\d+)\s*Min/)||String(s).match(/(\d+)\s*Min/); if(m){mins+=parseInt(m[2]||m[1]);any=true;}});
  let t=any?mins+5+Math.ceil(zLines.length/3):10+5*sLines.length;
  t=Math.max(10,Math.round(t/5)*5);
  return {k:Math.round(k/2),p:Math.round(p/2),t:"ca. "+t+" Min",unknown,found};
}

/* Zuordnung Angebot zu Einkaufslisten-Artikel: Kernwörter, Stoppwörter, Negativliste, Synonyme */
const OSTOP=new Set(["light","protein","high","frisch","frische","bio","pack","dose","roh","block","beutel","mager","nach","bedarf","stueck"]);
const OSYN=[[/toastbrot|sandwich ?brot/g,"toast"],[/passata|tomatensauce|tomatensosse/g,"passierte tomaten"],[/spaghetti|penne|fusilli|tagliatelle|rigatoni|makkaroni|farfalle/g,"nudeln"],[/mandelmilch/g,"mandeldrink"]];
const OBAD=/\b(milchreis|buttermilch|muellermilch|milchschnitte|kokosmilch|dessert|eierlikoer|eiernudeln?|erdnussbutter|butterkeks|kartoffelsalat|nudelsalat|wurstsalat|heringssalat|fleischsalat|eiersalat|tomatenmark|ketchup|thunfisch|hering|suppe|sauce|pesto|chips|waffeln|spielzeug)\b|muellermilch/;
const oParts=l=>String(l).split(/[\/()]/).map(nm).filter(Boolean);
function oScoreOne(a,b){
  const bad=a.match(OBAD); if(bad&&b.indexOf(bad[1]||bad[0])<0) return 0;
  const aw=a.split(" "), cw=b.split(" ").filter(w=>w.length>=4&&!OSTOP.has(w)); if(!cw.length) return 0;
  let hit=0;
  cw.forEach(x=>{ if(aw.some(w=>w.length>=3&&(w===x||stripPl(w)===stripPl(x)||(Math.min(w.length,x.length)>=6&&(w.startsWith(x)||x.startsWith(w)))||(x.length>=5&&x!=="milch"&&w.endsWith(x))))) hit++; });
  const need=cw.length<=2?cw.length:Math.ceil(cw.length/2);
  return hit>=need?hit/cw.length+(a.indexOf(b)>=0?1:0)+b.length/1000:0;
}
function oScore(offer,label){
  let a=nm(offer); if(!a) return 0;
  OSYN.forEach(r=>{a=a.replace(r[0],r[1]);});
  return oParts(label).reduce((m,p)=>Math.max(m,oScoreOne(a,p)),0);
}
const offerMatch=(a,b)=>oScore(a,b)>0;
function offersCompare(){
  const L=shopList(ST.sel), labels=[]; CATS.forEach(c=>L.out[c].forEach(x=>{if(labels.indexOf(x.l)<0)labels.push(x.l);}));
  const today=dkey(new Date()), live=(ST.offers||[]).concat(autoItems()).filter(o=>isLive(o,today)), by={};
  live.forEach(o=>{
    let m=null,best=0; labels.forEach(l=>{const s=oScore(o.i,l); if(s>best){best=s;m=l;}}); if(!m) return;
    const st=normStore(o.s), b=by[st]||(by[st]={});
    if(!b[m]||prNum(o.pr)<prNum(b[m].pr)) b[m]=o;
  });
  const rows=Object.keys(by).map(s=>({s,items:Object.keys(by[s]).map(l=>({l,o:by[s][l]}))})).sort((a,b)=>b.items.length-a.items.length);
  return {rows,total:labels.length,live:live.length};
}

const DCK="kochplaner.dc", DSK="kochplaner.dsync";
let DC=null; try{DC=localStorage.getItem(DCK);}catch(e){}
let dls=0; try{dls=parseInt(localStorage.getItem(DSK))||0;}catch(e){}
let dRef=null,dUnsub=null,dReady=false,dSaving=false,dDirty=false,dTimer=null,dState="off",dcShow=false;
var dRestoreMode=false;
const dSetSync=u=>{dls=u;try{localStorage.setItem(DSK,String(u));}catch(e){}};
const dLocalSave=()=>{try{localStorage.setItem(DLS,JSON.stringify(DY));}catch(e){}};
function dMerge(r){
  const sig=e=>[e.n,e.k,e.p,e.m].join("|");
  Object.keys(r.days||{}).forEach(k=>{
    if(!DY.days[k]){DY.days[k]=r.days[k];return}
    const have=new Set(DY.days[k].map(sig));
    r.days[k].forEach(e=>{if(!have.has(sig(e))) DY.days[k].push(e);});
  });
  (r.foods||[]).forEach(f=>{if(!DY.foods.some(x=>x.n.toLowerCase()===f.n.toLowerCase())) DY.foods.push(f);});
}
function dStop(){if(dUnsub){dUnsub();dUnsub=null;}dRef=null;dReady=false;dState="off";}
function dStart(){
  if(!window.FB||!DC||DC.length<16) return; dStop();
  dRef=FB.doc(FB.db,"diaries",DC);
  dUnsub=FB.onSnapshot(dRef,snap=>{
    if(snap.metadata.hasPendingWrites) return;
    if(snap.metadata.fromCache&&!snap.exists()) return;
    dState=snap.metadata.fromCache?"off":"online";
    if(!snap.exists()){
      if(dRestoreMode){dRestoreMode=false;dStop();DC=null;try{localStorage.removeItem(DCK);localStorage.removeItem(DSK);}catch(e){}toast("Diesen Code gibt es nicht. Bitte prüfen.");if(pm==="H"&&!pnl.hidden)openHh();return}
      dReady=true;dPush(true);return}
    dRestoreMode=false;
    let r; try{r=JSON.parse(snap.data().dyS);}catch(e){return}
    const ru=snap.data().u||0, lu=DY.u||0;
    if(ru>dls&&lu<=dls){
      DY=Object.assign({goal:{k:2100,p:150},days:{},foods:[]},r); DY.u=ru; dLocalSave(); dSetSync(ru);
      const a=document.activeElement; if(pm==="Y"&&!pnl.hidden&&!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))) drawDy(true);
    }else if(lu>dls){
      dMerge(r); DY.u=Date.now(); dLocalSave(); dReady=true; dPush(true);
    }
    dReady=true;
  },()=>{dState="error";});
}
function dPush(force){
  if(!dRef||!dReady) return;
  if(dSaving){dDirty=true;return}
  const u=DY.u||0; if(!force&&u<=dls) return;
  dSaving=true;
  FB.setDoc(dRef,{dyS:JSON.stringify(DY),u}).then(()=>{dSetSync(u);dState="online";}).catch(()=>{dState="error";}).finally(()=>{dSaving=false;if(dDirty){dDirty=false;dPush(false);}});
}
window.dHook=()=>{clearTimeout(dTimer);dTimer=setTimeout(()=>dPush(false),1200);};
if(window.FB) dStart(); else window.addEventListener("fb",dStart);

}

/* Vorschläge: Gerichte, die zum restlichen Eiweiß und zu den restlichen Kalorien passen */
function suggestHtml(){
  if(dyk!==dkey(new Date())) return "";
  const t=tot(dyk), G=DY.goal, rp=G.p-t.p, rk=G.k-t.k;
  if(rp<=0) return `<h3 class="sec">Vorschläge</h3><p class="empty" style="padding:6px 0">Dein Eiweiß-Ziel für heute ist erreicht.</p>`;
  const rate=ST.rate||{};
  let pool;
  if(rk>60){
    pool=ALL.filter(r=>r.p>=8&&r.k>0&&r.k<=rk*1.25).map(r=>{
      const cov=Math.min(r.p,rp)/rp, dens=r.p/r.k*100, fit=r.k<=rk?1:Math.max(0,1-(r.k-rk)/rk);
      return {r,s:cov*60+Math.min(dens,12)*2.5+fit*25+(rate[r.id]||0)*3-(grp(r)==="Dessert"?15:0)};
    });
  }else{
    pool=ALL.filter(r=>r.p>=8&&r.k>0&&r.k<=220).map(r=>({r,s:r.p/r.k*100+(rate[r.id]||0)}));
  }
  pool.sort((a,b)=>b.s-a.s);
  const pick=[],cnt={};
  for(const x of pool){const g=grp(x.r);if((cnt[g]||0)>=2)continue;pick.push(x.r);cnt[g]=(cnt[g]||0)+1;if(pick.length===3)break;}
  const head=`<h3 class="sec">Vorschläge</h3><p class="note" style="margin:0 0 6px">Noch ${f1(rp)} g Eiweiß und ${Math.max(0,Math.round(rk))} kcal offen.${rk<=60?" Das Kalorienziel ist fast erreicht, deshalb nur leichte Sachen mit viel Eiweiß.":""}</p>`;
  if(!pick.length) return head+'<p class="empty" style="padding:6px 0">Dazu passt gerade kein Rezept. Ein Shake oder Quark geht immer.</p>';
  return head+`<div class="box">`+pick.map(r=>`<div class="ent"><button class="sugn" data-sgopen="${r.id}"><b>${esc(r.n)}</b><span class="meta">+${r.p} g Eiweiß · ${r.k} kcal</span></button><div class="eac"><button class="btn" data-sgadd="${r.id}" style="width:auto;padding:0 14px;height:44px">Eintragen</button></div></div>`).join("")+`</div>`;
}

(function(){

  document.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();side=sx<=36?1:(sx>=window.innerWidth-36?-1:0);},{passive:true});

/* ===== Zusatz 13: Rezept aus Screenshot (Texterkennung auf dem Handy) oder eingefügtem Text ===== */
const IMPNL=String.fromCharCode(10);
const IMPEMO=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{2B50}]/gu;
let tessP=null;
function loadTess(){
  if(window.Tesseract) return Promise.resolve();
  if(tessP) return tessP;
  tessP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=()=>res();s.onerror=()=>{tessP=null;rej(new Error("load"));};document.head.appendChild(s);});
  return tessP;
}
async function ocrFiles(files,onProg){
  await loadTess();
  const w=await Tesseract.createWorker("deu",1,{langPath:"https://cdn.jsdelivr.net/npm/@tesseract.js-data/deu/4.0.0_best_int",logger:m=>{if(m&&m.status==="recognizing text")onProg(m.progress||0);}});
  const out=[];
  try{ for(const f of files){ const r=await w.recognize(f); out.push(r.data.text); } } finally { try{await w.terminate();}catch(e){} }
  return out.join(IMPNL+IMPNL);
}
function impFmt(v,u){let r;if(/^(g|ml|gramm)\b/i.test(u))r=Math.max(1,Math.round(v));else if(/^(kg|l|liter)\b/i.test(u))r=Math.round(v*100)/100;else r=Math.max(0.5,Math.round(v*2)/2);return String(r).replace(".",",");}
function impScale(line,factor){
  const m=line.match(/^(\d+(?:[.,]\d+)?|½|¼|¾)(\s*)(.*)$/); if(!m) return line;
  const base=m[1]==="½"?0.5:m[1]==="¼"?0.25:m[1]==="¾"?0.75:parseFloat(m[1].replace(",","."));
  return impFmt(base*factor,m[3])+m[2]+m[3];
}
function parseRecipeText(raw){
  const all=String(raw).split(/\r?\n/).map(l=>l.replace(IMPEMO," ").replace(/[|¦]/g," ").replace(/\s+/g," ").trim()).filter(Boolean);
  const lines=all.filter(l=>!/^(#\S+\s*)+$/.test(l)&&!/^@\S+$/.test(l));
  const bullet=l=>l.replace(/^[•·●▪■□*✔✓☑>»→~\-–—]+\s*/,"").trim();
  const H_Z=/^(zutaten|das brauchst du|du brauchst|einkaufsliste|ingredients)\b[:\s]*/i;
  const H_S=/^(zubereitung|so geht'?s|so gehts|und so geht'?s|anleitung|schritte|zubereitungsschritte|method)\b[:\s]*/i;
  const H_N=/^(n[aä]hrwerte|macros|nutrition)\b/i;
  let st="head"; const head=[],zl=[],sl=[]; let sawZ=false;
  lines.forEach(l=>{
    let m;
    if((m=l.match(H_Z))){st="z";sawZ=true;const rest=bullet(l.slice(m[0].length));if(rest&&!/^(für|fuer)\s+\d/i.test(rest)&&!/^\(.*\)$/.test(rest))zl.push(rest);return;}
    if((m=l.match(H_S))){st="s";const rest=l.slice(m[0].length).trim();if(rest)sl.push(rest);return;}
    if(H_N.test(l)){st="n";return;}
    if(st==="head")head.push(l); else if(st==="z")zl.push(bullet(l)); else if(st==="s")sl.push(l);
  });
  const amount=/^(\d|½|¼|¾|ein |eine |einen |etwas |je |prise |n\. ?b\.|nach geschmack)/i;
  if(!sawZ){
    zl.length=0;sl.length=0;
    lines.forEach(l=>{const b=bullet(l); if(amount.test(b)&&b.length<80&&!/[.!?]$/.test(b)&&!/\bkcal\b/i.test(b)) zl.push(b); else if(b.length>=25&&l!==head[0]) sl.push(l);});
  }
  const text=lines.join(IMPNL);
  let kcal="",prot="",t="",portions=0,m;
  if((m=text.match(/(\d{2,4})\s*(?:kcal|kalorien)\b/i))) kcal=m[1];
  if((m=text.match(/(?:eiwei(?:ß|ss)|protein)\w*[^\d\n]{0,14}?(\d{1,3})(?:[.,]\d+)?\s*g\b/i))||(m=text.match(/(\d{1,3})(?:[.,]\d+)?\s*g\s*(?:eiwei(?:ß|ss)|protein)/i))) prot=parseInt(m[1])<=200?m[1]:"";
  if((m=text.match(/(?:zeit|dauer)[^\d\n]{0,18}(\d{1,3})\s*min/i))||(m=text.match(/(\d{1,3})\s*min(?:uten)?\b/i))) t=m[1]+" Min";
  if((m=text.match(/(\d{1,2})\s*(?:portionen|portion|personen|person)\b/i))||(m=text.match(/f(?:ü|ue)r\s+(\d{1,2})\b/i))) portions=parseInt(m[1]);
  const n=(head.find(l=>l.length>=3&&l.length<=70&&!/\d+\s*(kcal|min)/i.test(l))||head[0]||"").replace(/\s*[:–-]\s*$/,"").replace(/^rezept\s*[:\-]?\s*/i,"").slice(0,60);
  const numbered=sl.some(l=>/^(?:schritt\s*)?\d{1,2}[.):\-]\s*\S/i.test(l));
  const steps=[];
  sl.forEach(l=>{
    const mm=l.match(/^(?:schritt\s*)?(\d{1,2})[.):\-]\s*(.*)$/i);
    if(mm){steps.push(mm[2]);return;}
    const prev=steps[steps.length-1];
    if(!steps.length||(!numbered&&/[.!?]$/.test(prev))) steps.push(l); else steps[steps.length-1]=prev+" "+l;
  });
  let z=zl.filter(x=>x&&x.length>1&&!/^(für|fuer)\s+\d/i.test(x));
  let scaled=0;
  if(portions>0&&portions!==2){const f=2/portions;z=z.map(l=>{const o=impScale(l,f);if(o!==l)scaled++;return o;});}
  return {n,z,s:steps.filter(Boolean),t,k:kcal,p:prot,portions,scaled};
}
function applyParsed(r){
  const set=(id,v)=>{const e=$(id);if(e&&v!==undefined&&v!=="")e.value=v;};
  set("#cr-n",r.n); if(r.z.length)set("#cr-z",r.z.join(IMPNL)); if(r.s.length)set("#cr-s",r.s.join(IMPNL)); set("#cr-t",r.t); set("#cr-k",r.k); set("#cr-p",r.p);
  let note="Übernommen: "+r.z.length+" Zutaten, "+r.s.length+" Schritte";
  if(r.k||r.p)note+=", Nährwerte aus dem Text ("+(r.k?r.k+" kcal":"")+(r.k&&r.p?", ":"")+(r.p?r.p+" g Eiweiß":"")+")";
  note+=".";
  if(r.portions&&r.portions!==2)note+=" Im Text stehen "+r.portions+" Portionen, die Mengen wurden auf 2 Personen umgerechnet.";
  if(!r.z.length)note+=" Zutaten wurden nicht erkannt, bitte unten eintragen.";
  note+=" Bitte alles kurz prüfen, die Texterkennung kann sich verlesen.";
  if(r.z.length&&(!r.k||!r.p||!r.t)){
    try{const e=estimateRecipe(r.z,r.s);if(!r.k)set("#cr-k",e.k);if(!r.p)set("#cr-p",e.p);if(!r.t)set("#cr-t",e.t);note+=" Fehlende kcal, Eiweiß und Zeit sind ungefähr aus den Zutaten berechnet.";}catch(e){}
  }
  const h=$("#crimpst"); if(h)h.textContent=note;
}
const _crH3=crHtml;
crHtml=function(id){
  const box=`<div class="box" style="padding:12px;margin:0 0 12px"><b>Aus Screenshot oder Text</b>
   <label class="btn pri" style="display:flex;align-items:center;justify-content:center;margin-top:8px;cursor:pointer">Screenshot auswählen<input id="cr-img" type="file" accept="image/*" multiple style="position:absolute;opacity:0;width:1px;height:1px"></label>
